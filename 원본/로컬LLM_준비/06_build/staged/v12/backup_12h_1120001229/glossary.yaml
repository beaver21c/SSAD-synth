    - {name: 장기요양보험료, vars: {직장가입자: nhi_premium_ltcare_amt1_y, 지역가입자: nhi_premium_ltcare_amt3_y}}
    - {name: 국민연금 보험료, aliases: [연금보험료], vars: {납부액: np_premium_amt2}}
