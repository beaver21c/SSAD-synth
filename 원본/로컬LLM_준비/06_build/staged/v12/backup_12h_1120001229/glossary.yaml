# ─────────────────────────── 소득·분배 용어 ───────────────────────────
- id: income
  name: 소득
  kind: 용어
  match_name: false          # 「소득」 한 낱말은 다른 말 안에 흔히 들어 있어 용어로 찾지 않는다(아래 통칭으로만 찾음)
  aliases: [소득 수준, 평균 소득, 소득 평균, 소득 중위값]
  desc: 자료의 소득 변수는 근로·일용·사업·금융·임대·사적연금·기타소득(원천별), 이를 합한 일차소득, 공적이전소득, 경상소득, 세금과 사회보험료를 뺀 가처분소득으로 구성됨. 개인 단위(p_)와 가구 단위(h_)가 따로 있고 균등화 가처분소득(eqinc)은 가구 가처분소득을 가구원수의 제곱근으로 나눈 값임.
  parts:
    - {name: 근로소득, vars: {개인: p_labinc}}
    - {name: 사업소득, vars: {개인: p_binc}}
    - {name: 일차소득, aliases: [시장소득], vars: {개인: p_minc, 가구: h_minc}}
    - {name: 공적이전소득, aliases: [이전소득], vars: {개인: p_pubinc, 가구: h_pubinc}}
    - {name: 경상소득, vars: {개인: p_oinc, 가구: h_oinc}}
    - {name: 가처분소득, aliases: [균등화], vars: {개인: p_dinc, 가구: h_dinc, 균등화: eqinc}}
  ambiguity:
    policy: ask
    ask: 근로소득, 사업소득, 일차소득, 공적이전소득, 경상소득, 가처분소득 중 어느 소득인지, 개인 단위인지 가구 단위인지
    resolvers: [금융소득, 임대소득, 일용소득, 기타소득, 분위]

- id: pubinc
  name: 공적이전소득
  kind: 용어
  aliases: [공적이전, 이전소득]
  desc: 사회보험 급여, 공공부조 급여, 사회수당 등 국가가 지급하는 현금 급여를 합한 소득임. 개별 급여의 연간 금액은 p_ 로 시작하는 금액 변수에 있음.
  target: 전체 인구(값이 0인 사람 포함)
  vars: {개인: p_pubinc, 가구: h_pubinc}

- id: poverty
  name: 빈곤율
  kind: 용어
  aliases: [상대 빈곤율, 상대빈곤율, 빈곤층, 빈곤 인구]
  desc: 이 자료에서 빈곤은 균등화 가처분소득이 전체 중위값의 50% 미만인 상태로 정의함(상대 빈곤). ssda.poverty_rate() 로 산출하며 빈곤 여부는 조건식에서 poor == 1, 분류 기준에서 poor2 로 씀.
  target: 전체 인구
  vars: {균등화 가처분소득: eqinc}

- id: lowinc
  name: 저소득층
  kind: 용어
  aliases: [저소득, 저소득 가구, 취약계층, 취약 계층, 차상위, 차상위계층]
  desc: 저소득층·취약계층은 정해진 정의가 없는 말임. 자료에서는 상대 빈곤층(poor == 1), 소득 1분위(inc5 == 0), 생계급여 등 기초생활보장 수급자로 조작적 정의를 할 수 있음. 차상위계층 여부를 나타내는 변수는 자료에 없음.
  ambiguity:
    policy: ask
    ask: 상대 빈곤층, 소득 1분위, 기초생활보장 수급자 중 무엇으로 정의할지(차상위계층 여부 변수는 자료에 없음)
    resolvers: [빈곤층, 1분위, 수급자, 생계급여, 의료급여]

- id: recipient
  name: 수급자
  kind: 용어
  aliases: [수급률, 수급 현황, 수급자 수, 수급 여부]
  desc: 수급자·수급률은 제도를 함께 말해야 뜻이 정해지는 말임. 제도 없이 쓰이면 어느 제도의 수급자인지 확인이 필요함. 수급 여부 변수는 연간 기준(_yn1)과 12월 기준(_yn2)이 따로 있음.
  ambiguity:
    policy: ask
    ask: 어느 제도의 수급자인지(예 기초연금, 생계급여, 국민연금, 장기요양)
    resolvers: []
    needs_program: true

