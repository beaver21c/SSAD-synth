# 제도 용어 사전 — 제도·급여·용어의 정식 명칭, 약어·통칭, 구성 급여, 자료의 변수, 모호한 용어의 확인 규칙
#
#   · 변수 대응은 코드북(work/registry/codebook.json) 기준이며 build_glossary.py 가 변수 사전과 대조해 검증한다.
#   · 약어·통칭은 KIHASA 통합 코퍼스(/mnt/share/corpus, 보건사회연구·연구보고서)의 사용 빈도를 확인해 수록했다(빈도는 glossary_report.json).
#   · 제도 설명은 자료 기준연도(2022년)의 내용이다. 선정 기준·급여액 같은 현행 수치는 담지 않는다.
#   · ambiguity.policy  ask: 질문에 내역이 없으면 「확인 필요」로 되묻는다 / assume: 기본 해석으로 진행하고 가정으로 밝힌다 / absent: 자료에 없는 항목임을 알리고 대안을 제시한다
#   · resolvers: 질문에 이 낱말이 있으면 내역이 정해진 것으로 본다(구성 급여의 이름·별칭은 자동으로 포함된다)

# ─────────────────────────── 공공부조 ───────────────────────────
- id: nbls
  name: 국민기초생활보장제도
  kind: 제도
  aliases: [국민기초생활보장, 기초생활보장제도, 기초생활보장, 국기초, 기초보장, 기초생보, 기초생활수급, 기초수급, 기초생활수급자, 기초수급자, 맞춤형 급여]
  desc: 소득인정액이 기준 중위소득의 일정 비율 이하인 가구에 급여를 지급하는 공공부조 제도임. 2015년 맞춤형 급여 개편 이후 생계·의료·주거·교육급여의 선정 기준이 따로 정해져 급여별로 수급 여부가 다름. 해산급여·장제급여는 자료에 없고 자활은 자활근로 참여 변수로 들어 있음.
  target: 전체 인구(가구 단위로 선정되며 자료에는 개인별 수급 여부로 들어 있음)
  parts:
    - {name: 생계급여, aliases: [생계], vars: {수급 여부(연간): nbls_live_yn1, 수급 여부(12월): nbls_live_yn2, 급여액: nbls_live_amt, 수급 기간: nbls_live_dur}}
    - {name: 의료급여, aliases: [의료], vars: {수급권 여부(연간): nbls_medi_yn1, 수급권 여부(12월): nbls_medi_yn2, 종별: nbls_medi_type, 적용법: nbls_medi_law}}
    - {name: 주거급여, aliases: [주거], vars: {임차급여 수급 여부(연간): nbls_house_yn1, 임차급여 급여액: nbls_house_amt, 수선유지급여 급여액: nbls_house_own_amt}}
    - {name: 교육급여, aliases: [교육], vars: {수급권 여부(연간): nbls_edu_yn1, 교육활동지원비: nbls_edu_amt1, 교과서대금·수업료·입학금: nbls_edu_amt2}}
  union: "nbls_live_yn1 == 1 or nbls_medi_yn1 == 1 or nbls_house_yn1 == 1 or nbls_edu_yn1 == 1"
  ambiguity:
    policy: ask
    ask: 생계·의료·주거·교육급여 중 어느 급여인지, 네 급여 중 하나라도 받는 사람 기준인지, 급여별로 각각 볼지
    resolvers: [하나라도, 어느 하나, 급여별, 각각, 네 급여, 4개 급여, 모든 급여]

- id: nbls_medi
  name: 의료급여
  kind: 급여
  aliases: [의료급여 수급권자, 의료급여 수급자, 의료보호]
  desc: 생활이 어려운 사람의 의료비를 국가가 부담하는 공공부조임. 자료의 의료급여 수급권은 국민기초생활보장법, 의료급여법, 다른 법에 따른 수급권을 모두 포함함(적용법 변수로 구분). 1종과 2종으로 나뉨. 건강보험 가입유형 변수에서는 의료급여세대주·세대원으로 표시됨.
  target: 전체 인구
  vars: {수급권 여부(연간): nbls_medi_yn1, 수급권 여부(12월): nbls_medi_yn2, 종별(1종·2종): nbls_medi_type, 적용법: nbls_medi_law, 유지 기간: nbls_medi_dur}
  notes: [국민기초생활보장제도의 의료급여만 보려면 nbls_medi_law == 1 조건을 함께 씀]

- id: nbls_house
  name: 주거급여
  kind: 급여
  aliases: [임차급여, 수선유지급여]
  desc: 국민기초생활보장제도의 급여로 임차가구에는 임차급여(임차료), 자가가구에는 수선유지급여(집수리)를 지급함. 자료의 수급 여부 변수는 임차급여 기준이며 수선유지급여는 급여액 변수만 있음.
  target: 전체 인구
  vars: {임차급여 수급 여부(연간): nbls_house_yn1, 임차급여 급여액: nbls_house_amt, 수선유지급여 급여액: nbls_house_own_amt}
  ambiguity:
    policy: assume
    default: 임차급여 수급 여부(nbls_house_yn1)
    ask: 임차급여인지 수선유지급여인지
    resolvers: [임차, 수선유지, 수선]

- id: aid
  name: 긴급복지지원
  kind: 제도
  aliases: [긴급복지, 긴급지원, 긴급복지지원제도]
  desc: 갑작스러운 위기 사유로 생계가 어려워진 가구에 생계·의료·주거·교육 지원을 단기간 제공하는 제도임.
  target: 전체 인구
  parts:
    - {name: 긴급 생계지원, aliases: [생계지원], vars: {수급 여부(연간): aid_live_yn1, 급여액: aid_live_amt}}
    - {name: 긴급 주거지원, aliases: [주거지원], vars: {수급 여부(연간): aid_house_yn1, 급여액: aid_house_amt}}
    - {name: 긴급 의료지원, aliases: [의료지원], vars: {지원 여부: aid_medi_yn, 지원액: aid_medi_amt}}
    - {name: 긴급 교육지원, aliases: [교육지원], vars: {지원 여부: aid_edu_yn, 지원액: aid_edu_amt}}
  union: "aid_live_yn1 == 1 or aid_house_yn1 == 1 or aid_medi_yn == 1 or aid_edu_yn == 1"
  ambiguity:
    policy: ask
    ask: 생계·주거·의료·교육 지원 중 어느 지원인지, 하나라도 받은 사람 기준인지
    resolvers: [하나라도, 어느 하나, 지원별, 각각]

- id: self
  name: 자활근로
  kind: 제도
  aliases: [자활사업, 자활, 자활급여]
  desc: 근로능력이 있는 수급자 등에게 일자리를 제공하는 자활사업임. 자료에는 자활근로 참여 여부와 급여액이 있음.
  target: 18세 이상
  vars: {참여 여부(연간): self_yn1, 급여액: self_amt, 참여 유형: self_type1}

# ─────────────────────────── 노후소득·연금 ───────────────────────────
- id: bp
  name: 기초연금
  kind: 제도
  aliases: [기초노령연금]
  desc: 65세 이상 노인 가운데 소득인정액이 선정기준액 이하인 사람에게 지급하는 연금임. 수급유형은 단독, 부부 1인 수급, 부부 2인 수급으로 나뉨.
  target: 65세 이상
  vars: {수급 여부(연간): bp_yn1, 수급 여부(12월): bp_yn2, 급여액: bp_amt, 수급유형: bp_type, 수급 기간: bp_dur}

- id: np
  name: 국민연금
  kind: 제도
  aliases: [노령연금]
  desc: 18세 이상 60세 미만 국민이 가입하는 공적연금임. 자료에는 가입 관련 변수(가입 여부, 가입종별, 기준소득월액, 보험료)와 수급 관련 변수(정기연금, 일시금)가 따로 있음. 가입자와 수급자는 서로 다른 집단임.
  target: 가입은 18~59세, 정기연금 수급은 60세 이상
  parts:
    - {name: 국민연금 가입, aliases: [가입, 가입자, 가입률], vars: {가입 여부(연간): np_yn, 가입종별: np_type, 가입상태: np_status, 기준소득월액: np_inc_amt, 보험료 납부액: np_premium_amt2}}
    - {name: 국민연금 정기연금 수급, aliases: [수급, 수급자, 수급률, 받는, 연금액, 급여액], vars: {수급 여부: np_pension_yn, 급여액: np_pension_amt}}
    - {name: 국민연금 일시금, aliases: [일시금], vars: {수급 여부: np_lump_yn, 급여액: np_lump_amt}}
  ambiguity:
    policy: ask
    ask: 국민연금 가입자 기준인지 연금 수급자 기준인지
    resolvers: [보험료, 납부, 기준소득월액, 받]

- id: occ_pension
  name: 직역연금
  kind: 제도
  aliases: [특수직역연금, 공무원연금, 사학연금, 사립학교교직원연금, 군인연금, 별정우체국연금]
  desc: 공무원, 사립학교 교직원, 군인, 별정우체국 직원이 가입하는 공적연금임. 직역연금 가입자는 국민연금에 가입하지 않음.
  target: 가입은 18~59세, 수급은 60세 이상
  parts:
    - {name: 공무원연금, aliases: [공무원], vars: {가입 여부(연간): govp_yn1, 정기연금 수급 여부: govp_pension_yn, 정기연금 급여액: govp_pension_amt, 보험료 납부액: govp_premium_amt}}
    - {name: 사립학교교직원연금, aliases: [사학연금, 사학], vars: {가입 여부(연간): privschp_yn1, 정기연금 수급 여부: privschp_pension_yn, 정기연금 급여액: privschp_pension_amt}}
    - {name: 군인연금, aliases: [군인], vars: {가입 여부(연간): milp_yn1, 정기연금 수급 여부: milip_pension_yn, 정기연금 급여액: milip_pension_amt}}
  union: "govp_pension_yn == 1 or privschp_pension_yn == 1 or milip_pension_yn == 1"
  notes: [별정우체국연금은 급여액(p_postp_pension_amt)과 보험료(p_postp_premium_amt)만 있음, union 식은 정기연금 수급자 기준임. 가입자 기준은 govp_yn1 == 1 or privschp_yn1 == 1 or milp_yn1 == 1]
  ambiguity:
    policy: assume
    default: 세 직역연금 중 하나라도 해당하는 사람(가입 또는 수급은 질문에 따름)
    ask: 어느 직역연금인지, 가입자 기준인지 수급자 기준인지
    resolvers: [하나라도, 각각]

- id: pension_all
  name: 연금
  kind: 용어
  aliases: [공적연금, 노후소득보장]
  desc: 연금이라는 말은 기초연금, 국민연금, 직역연금(공무원·사학·군인), 장애인연금, 산재보험 연금, 주택연금·농지연금을 모두 가리킬 수 있음. 제도마다 대상과 변수가 다름.
  parts:
    - {name: 기초연금, vars: {수급 여부(연간): bp_yn1, 급여액: bp_amt}}
    - {name: 국민연금, vars: {정기연금 수급 여부: np_pension_yn, 급여액: np_pension_amt}}
    - {name: 직역연금, aliases: [공무원연금, 사학연금, 군인연금], vars: {공무원연금 수급 여부: govp_pension_yn, 사학연금 수급 여부: privschp_pension_yn, 군인연금 수급 여부: milip_pension_yn}}
    - {name: 장애인연금, vars: {수급 여부(연간): disp_yn1, 급여액: disp_amt}}
    - {name: 주택연금, aliases: [농지연금], vars: {주택연금 가입 여부: rm_yn, 농지연금 가입 여부: frm_yn}}
  ambiguity:
    policy: ask
    ask: 기초연금, 국민연금, 직역연금, 장애인연금 중 어느 연금인지
    resolvers: []

- id: rm
  name: 주택연금
  kind: 제도
  aliases: [농지연금, 역모기지, 주택담보노후연금, 농지담보노후연금]      # 공식 명칭(2026-11-19 추가)
  desc: 주택(주택연금) 또는 농지(농지연금)를 담보로 매달 연금을 받는 금융상품임. 공적연금과 성격이 다름.
  target: 55세 이상(주택연금)
  vars: {주택연금 가입 여부: rm_yn, 주택연금 지급액: rm_amt, 농지연금 가입 여부: frm_yn, 농지연금 지급액: frm_amt}

# ─────────────────────────── 건강보험·의료 ───────────────────────────
- id: nhi
  name: 국민건강보험
  kind: 제도
  aliases: [건강보험, 건보, 건강보험 가입자]
  desc: 전 국민이 가입하는 사회보험임. 가입유형은 지역가입자(세대주·세대원), 직장가입자, 직장피부양자로 나뉘며 의료급여 수급권자는 건강보험 가입자가 아님. 자료에는 가입유형, 보험료, 의과 외래·입원 이용(내원일수·요양급여비용·본인부담금·공단부담금), 본인부담상한제, 산정특례가 있음.
  target: 전체 인구
  vars: {가입유형: nhi_type, 외래 내원일수: nhi_out_dur, 외래 요양급여비용: nhi_out_amt, 입원 재원일수: nhi_in_dur, 입원 요양급여비용: nhi_in_amt}
  notes: [가입유형 코드는 1 지역세대주, 2 지역세대원, 5 직장가입자, 6 직장피부양자, 7 의료급여세대주, 8 의료급여세대원, 표준 분류 기준 nhi3 은 지역가입·직장가입·의료급여 3구분임]

- id: nhi_fee
  name: 건강보험 본인부담금
  kind: 용어
  aliases: [본인부담금, 본인부담액, 본인부담, 법정본인부담금, 법정본인부담, 환자부담금, 본인일부부담금]
  desc: 건강보험 요양급여비용 가운데 환자가 내는 금액임(법정 본인부담금). 일반적으로는 비급여 진료비까지 포함하는 뜻으로도 쓰이나 자료에는 법정 본인부담금만 있음. 자료에는 의과 진료의 외래와 입원이 따로 있고 각각 요양기관 종별(의원·병원·종합병원·상급종합병원) 변수가 있음. 산정특례로 경감된 금액은 빠져 있음. 비급여 진료비와 약국·치과·한방의 본인부담금은 자료에 없음. 본인부담상한제 환급금, 장기요양 본인일부부담금, 장애인활동지원 본인부담금은 별도 변수임.
  target: 의료 이용자(값이 있는 사람). 값이 없는 사람은 그 해에 해당 진료를 이용하지 않은 사람임
  parts:
    - {name: 외래 본인부담금, aliases: [외래], vars: {의과 전체: nhi_out_fee, 의원: nhi_out_clinic_fee, 병원: nhi_out_hospital_fee, 종합병원: nhi_out_gehospital_fee, 상급종합병원: nhi_out_tehospital_fee}}
    - {name: 입원 본인부담금, aliases: [입원], vars: {의과 전체: nhi_in_fee, 의원: nhi_in_clinic_fee, 병원: nhi_in_hospital_fee, 종합병원: nhi_in_gehospital_fee, 상급종합병원: nhi_in_tehospital_fee}}
  sum: {name: 외래와 입원을 합한 본인부담금, vars: [nhi_out_fee, nhi_in_fee]}
  notes: [장기요양 본인일부부담금은 ltcare_hbn_fee(재가)·ltcare_ibn_fee(시설), 장애인활동지원 본인부담금은 disvou_act_fee, 본인부담상한제 환급금은 nhi_ceiling_amt]
  ambiguity:
    policy: ask
    ask: 외래 본인부담금인지 입원 본인부담금인지, 외래와 입원을 합한 금액인지, 요양기관 종별로 나눌지
    resolvers: [합한, 합계, 합쳐, 모두 더, 전체 합, 종별, 의원, 병원, 장기요양, 활동지원, 상한제]

- id: nhi_cost
  name: 진료비
  kind: 용어
  aliases: [의료비, 요양급여비용, 급여비, 의료비 지출, 진료비 지출]
  desc: 자료의 요양급여비용 총액은 건강보험이 적용되는 진료비 전체(공단부담금 + 본인부담금)임. 진료비·의료비라는 말은 총액, 본인부담금, 공단부담금 중 어느 것도 가리킬 수 있고 외래와 입원이 따로 있음. 비급여 진료비는 자료에 없음.
  target: 의료 이용자(값이 있는 사람)
  parts:
    - {name: 요양급여비용 총액, aliases: [총액, 총진료비], vars: {외래: nhi_out_amt, 입원: nhi_in_amt}}
    - {name: 본인부담금, aliases: [본인부담], vars: {외래: nhi_out_fee, 입원: nhi_in_fee}}
    - {name: 공단부담금, aliases: [공단부담, 보험자부담], vars: {외래: nhi_out_subsidy, 입원: nhi_in_subsidy}}
  sum: {name: 외래와 입원을 합한 요양급여비용 총액, vars: [nhi_out_amt, nhi_in_amt]}
  ambiguity:
    policy: ask
    ask: 요양급여비용 총액인지 본인부담금인지 공단부담금인지, 외래인지 입원인지 또는 둘을 합한 금액인지
