  desc: 이 낱말들이 가리키는 제도·항목은 자료(2022년 기준 사회보장행정데이터)에 변수가 없음. 부모급여는 2023년에 도입됐고, 비급여 진료비와 약국·치과·한방 진료비는 수록 범위 밖임.
