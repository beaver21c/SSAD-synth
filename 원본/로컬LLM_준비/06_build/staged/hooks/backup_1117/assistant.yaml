# 분석 지원기 설정 — 구축할 때 「구축 시 기입」 표시가 있는 값만 확정하면 된다.
# 경로는 준비 폴더 기준 상대 경로 또는 절대 경로. ${이름}은 환경변수로 바뀐다.

model:
  name: NousResearch/Arete-27B            # 2026-11-13 사용자 지정. Qwen3.8-27B 기반, Apache-2.0
  source: /mnt/share/hf_cache             # 공식 가중치(bf16, 54.7GB, 판 108f0afb)를 2026-11-13 내려받고 2026-11-14 해시·구조를 점검함. 기록은 모형반입/반입기록.md
  server: llama.cpp                       # 06_build/run_gpu_day.sh 가 llama.cpp 서버(serve_llamacpp.sh)를 먼저 띄우고, 뜨지 않으면 공식 가중치 4비트 서버(serve_transformers.py)로 바꿈. 두 서버의 주소와 모형 이름은 아래 값과 같음
  file: /mnt/share/models/arete-27b/Arete-27B-lora-Q5_K_M.gguf   # llama.cpp 로 구동할 때 쓰는 양자화 파일. 2026-11-17 미세조정 모형(어댑터 병합 뒤 Q5_K_M)으로 바꿈. 공식 가중치의 양자화본은 같은 폴더의 Arete-27B-Q5_K_M.gguf(Q4_K_M·Q6_K 도 있음). 기록은 모형반입/반입기록.md
  served_name: arete-27b                  # 추론 서버에 등록한 모형 이름(두 서버 스크립트의 기본값)
  base_url: http://127.0.0.1:8080/v1      # 추론 서버의 OpenAI 호환 주소(두 서버 스크립트의 기본 포트). 폐쇄망 안 주소만
  api_key_env: SSDA_LLM_KEY               # 서버가 키를 요구할 때 키를 담은 환경변수 이름(없으면 비워 둠)
  temperature: 0.0                        # 분석 코드는 재현성이 우선이므로 0
  max_tokens: 1500                        # 응답 1회의 상한
  context_tokens: 16384                   # 추론 서버에 설정한 문맥 길이(질의 1건은 8천 토큰 이내로 추정)
  timeout_sec: 600
  extra_body: {chat_template_kwargs: {enable_thinking: false}}   # 사고 과정 출력을 끔. 이 모형의 대화 틀은 이 인자가 없으면 사고 과정을 켜고 시스템 문구 앞에 영어 안내문을 덧붙임(check_model.py 로 확인). 반드시 false 로 둠. 두 서버 모두 이 인자가 대화 틀까지 전달됨(cpu_selftest.py 로 확인)

prompt:
  system: 03_prompts/system_prompt_v3.md  # 2026-11-17 개선판 3으로 바꿈(보완본 반영 뒤의 재평가: 미세조정 모형·분석 함수 0.4.1과의 조합이 벤치마크 121문항 중 118문항, 보류 검증 문항 1차 43문항 중 39문항, 2차 49문항 중 46문항 통과, 전 지표 충족. 같은 조건의 개선판 2는 117·40·43문항). 개선판 2는 system_prompt_v2.md, 처음 판은 system_prompt.md, 학습 자료와 같은 문구의 짧은 판은 system_prompt_short.md
  n_variable_cards: 5
  n_doc_cards: 2
  n_rule_cards: 1
  card_chars: 500
  n_term_cards: 2                         # 질문에 나온 제도명·약어의 「제도 설명」 카드 수(제도 용어 사전)
  term_card_chars: 1000
  n_examples: 0                           # 비슷한 질문의 처리 예를 몇 개 끼워 넣을지(0~3). 미세조정 없이 성능을 올리는 첫 수단
  warmup: true                            # llama.cpp 서버일 때 시작 시 시스템 프롬프트만 담은 요청을 한 번 보냄(질문마다 시스템 프롬프트를 다시 처리하지 않게 함)

run:
  max_steps: 4                            # 한 질문에서 코드를 실행할 수 있는 횟수(오류 수정 재시도 포함)
  timeout_sec: 60
  mem_gb: 6
  stdout_chars: 4000                      # 모형에 돌려주는 표준 출력의 상한(글자)
  isolate: true                           # true: 질의마다 새 프로세스에서 한도를 걸어 실행. 평가를 빨리 돌릴 때만 false

verify:                                   # 검증 단계(하네스가 수행). 끄면 해당 점검 없이 동작함
  result_checks: true                     # 산출 자동 점검을 「[검증 결과]」로 모형에 회신(분모·분류 누락·억제·전체 값·그림)
  ground_variables: true                  # 실행 전 변수 점검(없는 변수는 실행하지 않고 비슷한 이름 제시, 정의를 확인하지 않은 변수는 주의)
  ground_numbers: true                    # 응답 「결과」의 수치를 실행 결과와 대조
  answer_retries: 1                       # 수치 대조에 걸린 응답을 다시 쓰게 하는 횟수
  footer: true                            # 하네스가 만든 「검증 요약」을 응답 뒤에 붙임

paths:
  data: ${SSDA_DATA}                      # 구축 시 기입 — 분석 자료(parquet). 개발 중에는 대역 자료(가상데이터)
  export: export                          # 반출 신청 폴더(집계 결과 표·그림만 저장됨)
  log: logs/ssda_log.jsonl                # 분석 함수 호출 기록(누가 무엇을 산출했는지)
  transcripts: logs/transcripts.jsonl     # 질의·코드·실행 여부 기록(집계 결과의 값은 기록하지 않음)
