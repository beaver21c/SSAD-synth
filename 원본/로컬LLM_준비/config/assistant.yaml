# 분석 지원기 설정 — 구축할 때 「구축 시 기입」 표시가 있는 값만 확정하면 된다.
# 경로는 준비 폴더 기준 상대 경로 또는 절대 경로. ${이름}은 환경변수로 바뀐다.

model:
  name: NousResearch/Arete-27B            # 2026-11-13 사용자 지정. Qwen3.8-27B 기반, Apache-2.0
  source: /mnt/share/hf_cache             # 공식 가중치(bf16, 54.7GB, 판 108f0afb)를 2026-11-13 내려받고 2026-11-14 해시·구조를 점검함. 기록은 모형반입/반입기록.md
  server: llama.cpp                       # 06_build/run_gpu_day.sh 가 llama.cpp 서버(serve_llamacpp.sh)를 먼저 띄우고, 뜨지 않으면 공식 가중치 4비트 서버(serve_transformers.py)로 바꿈. 두 서버의 주소와 모형 이름은 아래 값과 같음
  file: /mnt/share/models/arete-27b/Arete-27B-Q5_K_M.gguf   # llama.cpp 로 구동할 때 쓰는 양자화 파일. 2026-11-18 공식 가중치의 양자화본(Q5_K_M)으로 바꿈: 독립 검증 2차(새 독립 문항)에서 조용한 오답률이 공식 가중치 4.6%, 미세조정 모형 11.8%였고 3차 판정은 공식 가중치 구성으로 6개 기준을 모두 충족함. 미세조정 모형은 같은 폴더의 Arete-27B-lora-Q5_K_M.gguf(Q4_K_M·Q6_K 도 있음). 기록은 모형반입/반입기록.md, docs/독립검증_재판정_보고서.html
  served_name: arete-27b                  # 추론 서버에 등록한 모형 이름(두 서버 스크립트의 기본값)
  base_url: http://127.0.0.1:8080/v1      # 추론 서버의 OpenAI 호환 주소(두 서버 스크립트의 기본 포트). 폐쇄망 안 주소만
  api_key_env: SSDA_LLM_KEY               # 서버가 키를 요구할 때 키를 담은 환경변수 이름(없으면 비워 둠)
  temperature: 0.0                        # 분석 코드는 재현성이 우선이므로 0
  max_tokens: 1500                        # 응답 1회의 상한
  context_tokens: 32768                   # 추론 서버에 설정한 문맥 길이. 2026-11-19 16384 → 32768(6차 기록 재구성: 16k에서 질문·붙임 문서가 든 메시지가 최종 응답 전에 지워진 대화 12/44. 16k 구동 때 GPU 사용 장당 약 10GB/16GB)
  timeout_sec: 600
  extra_body: {chat_template_kwargs: {enable_thinking: false}}   # 사고 과정 출력을 끔. 이 모형의 대화 틀은 이 인자가 없으면 사고 과정을 켜고 시스템 문구 앞에 영어 안내문을 덧붙임(check_model.py 로 확인). 반드시 false 로 둠. 두 서버 모두 이 인자가 대화 틀까지 전달됨(cpu_selftest.py 로 확인)

prompt:
  system: 03_prompts/system_prompt_v5.md  # 2026-11-18 개선판 5로 바꿈(독립 검증 재판정: 3차·4차 판정 모두 6개 기준 충족, 4차 조용한 오답률 3.2%, 통제 요청의 노출 0건). 개선판 3은 system_prompt_v3.md, 개선판 4는 system_prompt_v4.md 에 있음. 근거는 docs/독립검증_재판정_보고서.html
  n_variable_cards: 5
  n_doc_cards: 2
  n_rule_cards: 1
  card_chars: 500
  n_term_cards: 2                         # 질문에 나온 제도명·약어의 「제도 설명」 카드 수(제도 용어 사전)
  term_card_chars: 1000
  n_examples: 0                           # 비슷한 질문의 처리 예를 몇 개 끼워 넣을지(0~3). 미세조정 없이 성능을 올리는 첫 수단
  warmup: true                            # llama.cpp 서버일 때 시작 시 시스템 프롬프트만 담은 요청을 한 번 보냄(질문마다 시스템 프롬프트를 다시 처리하지 않게 함)

run:
  max_steps: 4                            # 한 질문에서 코드를 실행할 수 있는 횟수(오류 수정 재시도 포함)
  timeout_sec: 60
  mem_gb: 6
  stdout_chars: 4000                      # 모형에 돌려주는 표준 출력의 상한(글자)
  isolate: true                           # true: 질의마다 새 프로세스에서 한도를 걸어 실행. 평가를 빨리 돌릴 때만 false

verify:                                   # 검증 단계(하네스가 수행). 끄면 해당 점검 없이 동작함
  result_checks: true                     # 산출 자동 점검을 「[검증 결과]」로 모형에 회신(분모·분류 누락·억제·전체 값·그림)
  ground_variables: true                  # 실행 전 변수 점검(없는 변수는 실행하지 않고 비슷한 이름 제시, 정의를 확인하지 않은 변수는 주의)
  ground_numbers: true                    # 응답 「결과」의 수치를 실행 결과와 대조
  answer_retries: 1                       # 수치 대조에 걸린 응답을 다시 쓰게 하는 횟수
  footer: true                            # 하네스가 만든 「검증 요약」을 응답 뒤에 붙임
  # 보완 동작(2026-11-17 하네스 보완). 모형의 흐름이 막힌 경우에만 작동하며, 작동하지 않은 질문의 대화는 끈 설정과 같음. 끄려면 false
  #   반영 근거: 평가 전에 정한 기준(종합 판정 충족, 213문항 통과 수가 보완 전 203문항 이상, 거절 정확도·차단 실패·응하지 않는 요청 통과가 나빠지지 않음)을 충족함
  #             (보완 후 212문항, 새 문항인 보류 검증 문항 3차 17 → 22/29, 응답이 달라진 16문항은 모두 보완 동작이 작동한 문항). 설명자료 6.9절
  user_code: replace                      # 질문에 분석 코드가 있는데 모형이 코드 없이 확인을 요청하면 그 코드를 같은 점검·격리 실행에 넣고 결과를 돌려줌(replace: 되물은 응답을 「제시된 코드를 실행함」으로 바꿈, reply: 그대로 둠)
  repeat_guard: true                      # 실패한 코드와 같은 코드가 다시 제출되면 실행하지 않고 고칠 곳을 알려 돌려보냄
  var_candidates: true                    # 한 질문에서 없는 변수 오류가 두 번째 나면 질문의 낱말로 변수 사전을 찾은 후보를 덧붙임
  unexecuted_results: true                # 실행한 코드가 없는데 결과 표를 적은 응답을 받아들이지 않음(질문당 1회 다시 쓰게 하고, 남으면 검증 요약에 경고). 전 문항 평가 뒤에 더한 동작으로 4문항 확인 실행과 기존 기록 대조로 확인함
  # 독립 검증 재판정(2026-11-17~18) 뒤에 더한 동작. 근거는 05_eval/independent/r3/계획.md 6~7절, r4/계획.md 5절, docs/독립검증_재판정_보고서.html
  ask_gate: true                          # 용어 사전이 되물으라고 한 경우가 아닌데 코드 없이 되물으면 한 번 돌려보냄(질문의 낱말로 찾은 변수 후보를 덧붙임)
  name_cards: true                        # 질문의 낱말이 한글 이름에 든 변수의 카드를 참고 자료에 덧붙임(검색 순위에서 밀린 변수 보완)
  review: false                           # 실행한 산출이 질문과 일치하는지 모형에 다시 묻는 검토. 판별력 측정에서 정답 차례의 31.0%를 불일치로 판정해 끔(기준 10% 이하)
  diff_guard: true                        # 대화 단위 차분 점검(분석 함수 0.7.0): 같은 대화에서 앞서 표시한 집계와의 차이로 소수 집단의 값이 드러나는 칸을 가림. 통제 기능이므로 끄지 않음
  precheck: true                          # 요청 대조에서 고치면 대상이 달라지는 경고(기준 시점·연령 경계 등)가 붙은 코드는 실행 전에 돌려보냄(같은 코드를 다시 내면 실행). 4차 판정 구성에 포함
  ruleset: 9                              # 요청 대조·변수 후보·용어 해석의 규칙 묶음. 2026-11-18 독립 검증 5차 계획 7절의 규칙에 따라 9로 함(4차 결과 반영: 전체·구성 변수 관계, 낱말 전체 일치, 영문 조건어, 자료에 없는 항목의 안내, 조건식의 함수·괄호, 한 살 단위 구간).
                                          # 8 은 4차 판정 구성. 10(5차 결과의 보완, 개선판 6과 함께 씀)은 개발 측정에서 반영 기준에 미달해 쓰지 않음. 5차 판정은 8·9 모두 「신뢰 미흡」. 근거는 docs/독립검증_5차_보고서.html, 05_eval/independent/r5/계획.md

paths:
  data: ${SSDA_DATA}                      # 구축 시 기입 — 분석 자료(parquet). 개발 중에는 대역 자료(가상데이터)
  export: export                          # 반출 신청 폴더(집계 결과 표·그림만 저장됨)
  log: logs/ssda_log.jsonl                # 분석 함수 호출 기록(누가 무엇을 산출했는지)
  transcripts: logs/transcripts.jsonl     # 질의·코드·실행 여부 기록(집계 결과의 값은 기록하지 않음)
