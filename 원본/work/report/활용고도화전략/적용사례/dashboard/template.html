<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사회보장행정데이터 대시보드(가상데이터 시연)</title>
<style>
  @page { size: A4 landscape; margin: 10mm; }
  :root { --ink:#1C1C1A; --paper:#F0EFEB; --soft:#F7F6F2; --line:#D5D4CE; --muted:#63625C; --acc:#1F4E79; --acc2:#C55A11; --ok:#2E7D32; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { color: var(--ink); background: #fff; font-size: 14px; line-height: 1.5; word-break: keep-all;
         font-family: "KoPubDotum", "KoPub돋움체", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { background: var(--ink); color: #fff; padding: 10px 18px 0; }
  header .top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -.02em; }
  header .badge { font-size: 11.5px; border: 1px solid #fff; padding: 0 6px; border-radius: 2px; }
  header .sub { font-size: 12px; color: #D9D8D2; margin-left: auto; }
  nav { display: flex; gap: 2px; margin-top: 9px; flex-wrap: wrap; }
  nav button { background: #3A3A37; color: #E9E8E3; border: 0; padding: 7px 13px; font: inherit; font-size: 13.5px; cursor: pointer; border-radius: 3px 3px 0 0; }
  nav button.on { background: #fff; color: var(--ink); font-weight: 700; }
  .page { display: grid; grid-template-columns: 286px 1fr; min-height: calc(100vh - 118px); }
  .page.wide { grid-template-columns: 1fr; }
  .page.wide aside { display: none; }
  .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin: 12px 0 16px; }
  .hero .h { border: 1px solid var(--line); border-left: 8px solid var(--acc); padding: 12px 14px; }
  .hero .h .who { font-size: 12.5px; color: var(--muted); }
  .hero .h .big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
  .hero .h .big small { font-size: 14px; font-weight: 400; }
  .hero .h .what { font-size: 13.5px; }
  .dots { line-height: 0; margin-top: 6px; } .dots i { display: inline-block; width: 9px; height: 9px; margin: 1px; border-radius: 50%; background: #DDDCD6; } .dots i.on { background: var(--acc); }
  dl.terms dt { font-weight: 700; margin-top: 10px; } dl.terms dd { margin: 2px 0 0; font-size: 13.5px; }
  aside { background: var(--soft); border-right: 1px solid var(--line); padding: 14px 14px 20px; }
  main { padding: 16px 20px 26px; min-width: 0; }
  aside h3 { font-size: 13px; margin: 14px 0 5px; }
  aside h3:first-child { margin-top: 0; }
  label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 9px 0 3px; }
  select, input[type=text], input[type=number] { width: 100%; font: inherit; font-size: 13px; padding: 5px 6px; border: 1px solid #B9B8B2; border-radius: 3px; background: #fff; color: var(--ink); }
  .seg { display: flex; flex-wrap: wrap; gap: 3px; }
  .seg button, .btn { font: inherit; font-size: 12.5px; padding: 4px 9px; border: 1px solid #B9B8B2; background: #fff; border-radius: 3px; cursor: pointer; color: var(--ink); }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.pri { background: var(--acc); color: #fff; border-color: var(--acc); }
  .btn:hover, .seg button:hover { border-color: var(--ink); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .chk { font-size: 12.5px; display: flex; gap: 5px; align-items: center; margin-top: 6px; }
  h2 { font-size: 17px; margin: 0 0 3px; letter-spacing: -.01em; }
  .desc { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
  .grade { display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 2px; border: 1px solid var(--ink); margin-left: 6px; vertical-align: 2px; }
  .grade.g가 { background: #fff; } .grade.g나 { background: #FFF2CC; } .grade.g다 { background: #F8CBAD; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 10px 0 14px; }
  .card { border: 1px solid var(--line); border-top: 4px solid var(--ink); padding: 9px 11px; background: #fff; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
  .card .u { font-size: 12px; font-weight: 400; margin-left: 2px; }
  .card .d { font-size: 11.5px; color: var(--muted); }
  .card .d.up { color: var(--acc2); } .card .d.down { color: var(--acc); }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .grid2e { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .panel { border: 1px solid var(--line); padding: 10px 12px; background: #fff; min-width: 0; }
  .panel h4 { margin: 0 0 6px; font-size: 13.5px; }
  table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.t th, table.t td { border: 1px solid var(--line); padding: 3px 6px; text-align: right; white-space: nowrap; }
  table.t th { background: var(--paper); text-align: center; font-weight: 700; }
  table.t td.l, table.t th.l { text-align: left; }
  table.t td.sup { color: #8A8983; background: repeating-linear-gradient(45deg, #F4F3EF, #F4F3EF 4px, #EAE9E4 4px, #EAE9E4 8px); text-align: center; }
  table.t td.na { color: #B0AFA9; text-align: center; }
  table.t tr.hl td { background: #FFF6DA; font-weight: 700; }
  .scroll { overflow: auto; max-height: 560px; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .warn { font-size: 12.5px; border: 1px solid var(--acc2); border-left: 5px solid var(--acc2); background: #FFF8F2; padding: 7px 10px; margin: 8px 0; }
  .info { font-size: 12.5px; border: 1px solid var(--line); border-left: 5px solid var(--ink); background: #FAFAF8; padding: 7px 10px; margin: 8px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips button { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid #B9B8B2; background: #fff; border-radius: 12px; cursor: pointer; }
  .chips button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  .vlist { max-height: 620px; overflow: auto; border: 1px solid var(--line); background: #fff; }
  .vlist div { padding: 4px 8px; border-bottom: 1px solid #ECEBE6; cursor: pointer; font-size: 12.5px; }
  .vlist div.on { background: var(--ink); color: #fff; }
  .vlist div small { color: #8A8983; margin-left: 4px; } .vlist div.on small { color: #D9D8D2; }
  svg text { font-family: inherit; }
  #tip { position: fixed; pointer-events: none; background: rgba(28,28,26,.94); color: #fff; font-size: 12px; padding: 5px 8px; border-radius: 3px; display: none; z-index: 20; max-width: 280px; white-space: pre-line; }
  footer { font-size: 11.5px; color: var(--muted); padding: 8px 18px 14px; border-top: 1px solid var(--line); }
  .cases { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
  .case { border: 1px solid var(--line); border-left: 6px solid var(--acc); padding: 9px 12px; }
  .case b { display: block; font-size: 13.5px; } .case p { margin: 3px 0 6px; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 980px) { .page { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } .grid2, .grid2e { grid-template-columns: 1fr; } }
  @media print {
    header .sub, nav, aside, .no-print, footer .q { display: none !important; }
    header { background: #fff; color: var(--ink); padding: 0 0 6px; border-bottom: 2px solid var(--ink); }
    header .badge { border-color: var(--ink); }
    .page { display: block; min-height: 0; } main { padding: 10px 0 0; }
    .scroll, .vlist { max-height: none; overflow: visible; }
    .panel, .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <div class="top"><h1>사회보장행정데이터 대시보드</h1><span class="badge">가상데이터 시연</span>
    <span class="sub" id="hsub"></span></div>
  <nav id="nav"></nav>
</header>
<div class="page" id="page"><aside id="side"></aside><main id="main"></main></div>
<footer><span id="foot"></span> <span class="q" id="qcount"></span></footer>
<div id="tip"></div>

<script>
const S = /*__STORE__*/null;
const G = /*__GEO__*/null;
const SIM = /*__SIM__*/null;
</script>
<script>
'use strict';
/* ───────────── 기본 도구 ───────────── */
const $ = (q, el) => (el || document).querySelector(q);
const el = (tag, attrs, html) => { const e = document.createElement(tag); if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IND = Object.fromEntries(S.inds.map(d => [d.id, d]));
const DIMS = S.dims, ORDER = S.order;
const SIDO = DIMS.sido.cats;
const CITY = S.city;
const SIDO_FULL = ['서울특별시', '부산광역시', '대구광역시', '인천광역시', '광주광역시', '대전광역시', '울산광역시', '세종특별자치시', '경기도', '강원특별자치도', '충청북도', '충청남도', '전북특별자치도', '전라남도', '경상북도', '경상남도', '제주특별자치도'];
const THR = S.meta.thr, MAXDIM = S.meta.maxdim;
const fmtN = (v, dec) => v == null ? '' : Number(v).toLocaleString('ko-KR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec == null ? 1 : dec });
const decOf = unit => unit === '%' ? 1 : (unit === '일' ? 1 : 0);
const fmtV = (v, unit) => v == null ? '' : fmtN(v, decOf(unit));
const fmtPop = v => v == null ? '' : (v >= 1e8 ? fmtN(v / 1e8, 2) + '억' : v >= 1e4 ? fmtN(v / 1e4, v >= 1e6 ? 0 : 1) + '만' : fmtN(v, 0));
const sig3 = x => { if (x == null || !isFinite(x)) return null; if (x === 0) return 0; const k = Math.floor(Math.log10(Math.abs(x))) - 2; const p = Math.pow(10, k); return k >= 0 ? Math.round(x / p) * p : Number((Math.round(x / p) * p).toFixed(-k)); };
const ST_TXT = { 1: '마킹', 2: '마킹*', 3: '–' };
const gradeTag = g => `<span class="grade g${g}">등급 ${g} · 최소 ${THR[g]}건</span>`;

/* 표 접근: 지표 id + 차원 목록 → 칸 배열 */
function keyOf(dims) { return ORDER.filter(d => dims.includes(d)).join('|'); }
function table(ind, dims) { const k = keyOf(dims); const t = S.tabs[ind][k]; return t ? { key: k, dims: k ? k.split('|') : [], t } : null; }
function cellIdx(dims, pos) { let i = 0; for (const d of dims) i = i * DIMS[d].cats.length + pos[d]; return i; }
function valueOf(ind, wn, wd, s) { const kd = IND[ind].kind; if (kd === 'rate') return wd ? 100 * wn / wd : null; if (kd === 'mean_r') return wn ? s / wn : null; return wd ? s / wd : null; }
function roundV(ind, v) { return v == null ? null : (IND[ind].kind === 'rate' ? Math.round(v * 10) / 10 : sig3(v)); }

/* 질의 기록(R8 점검용) */
const QLOG = [];
function logQ(tab, text) { const last = QLOG[QLOG.length - 1]; if (last && last.text === text) return; QLOG.push({ time: new Date().toLocaleTimeString('ko-KR'), tab, text }); $('#qcount').textContent = `· 이번 접속의 질의 기록 ${QLOG.length}건`; }

/* ───────────── 색·분류 ───────────── */
const PAL = {
  Blues: ['#f7fbff', '#deebf7', '#c6dbef', '#9ecae1', '#6baed6', '#4292c6', '#2171b5', '#08519c', '#08306b'],
  YlOrRd: ['#ffffcc', '#ffeda0', '#fed976', '#feb24c', '#fd8d3c', '#fc4e2a', '#e31a1c', '#bd0026', '#800026'],
  Greens: ['#f7fcf5', '#e5f5e0', '#c7e9c0', '#a1d99b', '#74c476', '#41ab5d', '#238b45', '#006d2c', '#00441b'],
  RdYlGn: ['#d73027', '#f46d43', '#fdae61', '#fee08b', '#ffffbf', '#d9ef8b', '#a6d96a', '#66bd63', '#1a9850'],
  Spectral: ['#d53e4f', '#f46d43', '#fdae61', '#fee08b', '#ffffbf', '#e6f598', '#abdda4', '#66c2a5', '#3288bd'],
  Viridis: ['#440154', '#472d7b', '#3b528b', '#2c728e', '#21918c', '#28ae80', '#5ec962', '#addc30', '#fde725'],
};
const PAL_NAME = { Blues: '파랑', YlOrRd: '노랑–빨강', Greens: '초록', RdYlGn: '빨강–초록', Spectral: '다색 발산', Viridis: '비리디스' };
const SEQ = { Blues: 1, YlOrRd: 1, Greens: 1 };
function ramp(name, k, rev) { const p = PAL[name] || PAL.Blues; const lo = SEQ[name] ? 1 : 0; const out = []; for (let i = 0; i < k; i++) out.push(p[Math.round(lo + i * (8 - lo) / Math.max(k - 1, 1))]); return rev ? out.reverse() : out; }
function textOn(hex) { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#1C1C1A' : '#fff'; }
function breaks(vals, k, method) {
  const v = vals.filter(x => x != null && isFinite(x)).slice().sort((a, b) => a - b);
  if (v.length < 2) return [];
  k = Math.min(k, new Set(v).size);
  if (k < 2) return [];
  if (method === 'equal') { const lo = v[0], hi = v[v.length - 1]; return Array.from({ length: k - 1 }, (_, i) => lo + (hi - lo) * (i + 1) / k); }
  if (method === 'jenks') return jenks(v, k);
  return Array.from({ length: k - 1 }, (_, i) => { const p = (i + 1) / k * (v.length - 1); const a = Math.floor(p); return v[a] + (v[Math.min(a + 1, v.length - 1)] - v[a]) * (p - a); });
}
function jenks(v, k) {            /* 자연단절(Fisher–Jenks) */
  const n = v.length, m1 = [], m2 = [];
  for (let i = 0; i <= n; i++) { m1.push(new Array(k + 1).fill(0)); m2.push(new Array(k + 1).fill(Infinity)); }
  for (let j = 1; j <= k; j++) { m1[1][j] = 1; m2[1][j] = 0; }
  for (let l = 2; l <= n; l++) {
    let s1 = 0, s2 = 0, w = 0, vv = 0;
    for (let m = 1; m <= l; m++) {
      const i3 = l - m + 1, val = v[i3 - 1];
      s2 += val * val; s1 += val; w++; vv = s2 - s1 * s1 / w;
      const i4 = i3 - 1;
      if (i4 !== 0) for (let j = 2; j <= k; j++) if (m2[l][j] >= vv + m2[i4][j - 1]) { m1[l][j] = i3; m2[l][j] = vv + m2[i4][j - 1]; }
    }
    m1[l][1] = 1; m2[l][1] = vv;
  }
  const br = []; let kk = n;
  for (let j = k; j >= 2; j--) { const id = m1[kk][j] - 1; br.unshift((v[id - 1] + v[id]) / 2); kk = m1[kk][j] - 1; }
  return br;
}
const classOf = (x, br) => { let c = 0; while (c < br.length && x > br[c]) c++; return c; };

/* ───────────── 지도 ───────────── */
function drawMap(host, cfg) {
  /* cfg: level('sido'|'city'), vals[], st[], colors[], br[], cls[](구간화 지표), unit, labels('none'|'name'|'value'), hl(index), title */
  const W = G.w, H = G.h, k = cfg.colors.length;
  const parts = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 0 ${W - 60} ${H + 46}" style="width:100%;height:auto;display:block;background:#fff">`,
    `<defs><pattern id="hat" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#EFEEE9"/><line x1="0" y1="0" x2="0" y2="5" stroke="#C9C8C2" stroke-width="1.6"/></pattern></defs>`];
  if (cfg.title) parts.push(`<text x="70" y="20" font-size="15" font-weight="700">${esc(cfg.title)}</text>`);
  const shapes = cfg.level === 'city' ? G.sgg : G.sido;
  const fillOf = i => { if (cfg.st[i] === 3) return '#fff'; if (cfg.st[i]) return 'url(#hat)'; const c = cfg.cls ? cfg.cls[i] - 1 : classOf(cfg.vals[i], cfg.br); return cfg.colors[Math.max(0, Math.min(k - 1, c))]; };
  parts.push('<g transform="translate(0,26)">');
  shapes.forEach((g, n) => {
    const i = cfg.level === 'city' ? n : g.idx;
    parts.push(`<path d="${g.d}" fill="${fillOf(i)}" stroke="${cfg.level === 'city' ? '#8D8C86' : '#55544F'}" stroke-width="${cfg.level === 'city' ? .35 : .7}" data-i="${i}"/>`);
  });
  if (cfg.level === 'city') G.sido.forEach(g => parts.push(`<path d="${g.d}" fill="none" stroke="#1C1C1A" stroke-width="1" pointer-events="none"/>`));
  if (cfg.hl != null && cfg.hl >= 0) { const g = cfg.level === 'city' ? G.sgg[cfg.hl] : G.sido.find(x => x.idx === cfg.hl); if (g) parts.push(`<path d="${g.d}" fill="none" stroke="#C55A11" stroke-width="2.6" pointer-events="none"/>`); }
  if (cfg.labels !== 'none' && cfg.level === 'sido') G.sido.forEach(g => {
    const i = g.idx, t = cfg.labels === 'name' ? SIDO[i] : (cfg.st[i] ? ST_TXT[cfg.st[i]] : fmtV(cfg.vals[i], cfg.unit));
    const fc = cfg.st[i] ? '#1C1C1A' : textOn(fillOf(i));
    parts.push(`<text x="${g.lx}" y="${g.ly}" font-size="11.5" font-weight="700" text-anchor="middle" fill="${fc}" stroke="${fc === '#fff' ? '#1C1C1A' : '#fff'}" stroke-width="2.4" paint-order="stroke" stroke-opacity=".55" pointer-events="none">${esc(t)}</text>`);
  });
  parts.push('</g>');
  /* 범례 */
  const lx = W - 250, ly = H - 168;
  parts.push(`<g transform="translate(${lx},${ly})" font-size="11.5">`, `<text x="0" y="-8" font-weight="700">${esc(cfg.legend || '')}</text>`);
  for (let c = 0; c < k; c++) {
    const lab = cfg.cls ? `구간 ${c + 1}${c === 0 ? '(낮음)' : c === k - 1 ? '(높음)' : ''}` : (c === 0 ? `${fmtV(cfg.br[0], cfg.unit)} 이하` : c === k - 1 ? `${fmtV(cfg.br[k - 2], cfg.unit)} 초과` : `${fmtV(cfg.br[c - 1], cfg.unit)} ~ ${fmtV(cfg.br[c], cfg.unit)}`);
    parts.push(`<rect x="0" y="${c * 18}" width="22" height="14" fill="${cfg.colors[c]}" stroke="#8D8C86" stroke-width=".4"/><text x="29" y="${c * 18 + 11}">${lab}</text>`);
  }
  parts.push(`<rect x="0" y="${k * 18 + 3}" width="22" height="14" fill="url(#hat)" stroke="#8D8C86" stroke-width=".4"/><text x="29" y="${k * 18 + 14}">마킹(기준 미달)</text>`, '</g>');
  if (cfg.foot) parts.push(`<text x="70" y="${H + 36}" font-size="10.5" fill="#63625C">${esc(cfg.foot)}</text>`);
  parts.push('</svg>');
  host.innerHTML = parts.join('');
  const svg = host.firstChild;
  svg.addEventListener('mousemove', e => { const p = e.target.closest('path[data-i]'); if (!p) return hideTip(); const i = +p.dataset.i; const name = cfg.level === 'city' ? `${CITY.sido[i]} ${CITY.names[i]}` : SIDO_FULL[i];
    const v = cfg.st[i] ? (cfg.st[i] === 3 ? '대상 없음' : '마킹(최소 관측 수 미달)') : (cfg.cls ? `구간 ${cfg.cls[i]} / 5` : `${fmtV(cfg.vals[i], cfg.unit)}${cfg.unit}`); showTip(e, `${name}\n${v}`); });
  svg.addEventListener('mouseleave', hideTip);
  svg.addEventListener('click', e => { const p = e.target.closest('path[data-i]'); if (p && cfg.onPick) cfg.onPick(+p.dataset.i); });
  return svg;
}
function showTip(e, t) { const tip = $('#tip'); tip.textContent = t; tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; }
function hideTip() { $('#tip').style.display = 'none'; }

function parseG(s) { const g = {}; (s || '').split(';').forEach(p => { const [d, v] = p.split(':'); if (d && v != null && v !== '') g[d] = v.split('.').map(Number); }); return g; }

/* ───────────── 화면: 지표 만들기 ───────────── */

   <p class="note">산식은 주소(#)에 저장되므로 주소를 복사해 공유할 수 있음.</p>`;

  const grade = used.some(x => x.grade === '다') ? '다' : used.some(x => x.grade === '나') ? '나' : '가';
  const name = ST.bnm || `${num.map(n => MM[n].name).join(' + ')} ÷ ${den === '_1' ? '1' : MM[den].name} × ${fmtN(f, 0)}`;
  const calc = L => { const n = L === 'city' ? CITY.codes.length : L === 'sido' ? 17 : 1; const arrs = num.map(x => MM[x].get(L)), da = den === '_1' ? null : MM[den].get(L);
    if (arrs.some(a => !a) || (den !== '_1' && !da)) return null;
    return Array.from({ length: n }, (_, i) => { let s = 0; for (const a of arrs) { if (a[i] == null) return null; s += a[i]; } if (den !== '_1') { if (da[i] == null || da[i] === 0) return null; s /= da[i]; } const v = s * f; return Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100; }); };

  drawChart($('#c3'), { type: 'line', cats: B.map(v => pol === 'bp' ? (v > 0 ? '+' : '') + v + '만원' : v + '만원'), series: A.filter(v => pol === 'bp' ? [50, 70, 100].includes(v) || v === a : [8, 13, 18].includes(v) || v === a).map(v => ({ name: (pol === 'bp' ? '범위 ' + v + '%' : v + '세 미만'), vals: B.map(q => P.grid[K(v, q, x)][pk]) })), unit: '%', showVal: false, w: 640, title: `${pol === 'bp' ? '월 급여 변화' : '월 지급액'}별 ${P.group} 빈곤율` });

  const rows = []; A.forEach(p => B.forEach(q => { const g = P.grid[K(p, q, x)]; rows.push([p, q, fmtN(g.rec / 1e4, 0), fmtN(g.cost, 2), fmtN(g[pk], 2), fmtN(g.rng, 1)]); }));
  $('#tb').innerHTML = tableHTML(head, rows, { hl: A.indexOf(a) * B.length + B.indexOf(b) });
  $('#png').onclick = () => savePNG(svg1, `모의실험_${pol}_${a}_${b}_${x}`);
  $('#csv').onclick = () => saveCSV([head].concat(rows), `모의실험_${pol}_추가${x}`);
  logQ('정책 모의실험', `${P.name} / ${setTxt}`);
}

/* ───────────── 국민용 요약 화면(공개용 집계표만 사용) ───────────── */
const PV = id => { const t = S.tabs[id]['']; return t.st[0] ? null : t.v[0]; };
function heroCard(d, v, who) { const n = Math.round(v); let dots = ''; for (let i = 0; i < 100; i++) dots += `<i class="${i < n ? 'on' : ''}"></i>`;
  return `<div class="h"><div class="who">${esc(who || d.who)} 100명 중</div><div class="big">${n}<small>명</small></div><div class="what">${esc(d.easy)}</div><div class="dots">${dots}</div></div>`; }
function vPubHome(side, main) {
  $('#page').classList.add('wide'); side.innerHTML = '';
  const pick = ['bp', 'nppen', 'np', 'empins', 'live', 'dis', 'single', 'age65'].filter(i => IND[i] && PV(i) != null);
  const life = [['아동기', ['childcare']], ['청년·중장년기', ['np', 'empins', 'jobseek', 'itc']], ['노년기', ['bp', 'nppen', 'ltc']]];
  main.innerHTML = `<h2>한눈에 보는 사회보장</h2><p class="desc">우리나라 사회보장제도를 누가 얼마나 이용하는지를 시도와 연령대 단위로 보여 주는 화면임. ${esc(S.meta.note)}.</p>
   <div class="hero">${pick.map(i => heroCard(IND[i], PV(i))).join('')}</div>
   <h2>생애주기별 제도 이용</h2><p class="desc">각 제도의 대상 연령에 해당하는 사람 100명 중 이용하는 사람의 수</p>
   <div class="grid2e" style="grid-template-columns:repeat(3,1fr)">${life.map((g, k) => `<div class="panel"><div id="lf${k}"></div></div>`).join('')}</div>
   <div class="info" style="margin-top:14px">이 화면의 수치는 사람 수가 30명에 못 미치는 칸을 표시하지 않고, 비율만 제공함. 개인을 알아볼 수 있는 자료는 포함되어 있지 않음.</div>`;
  life.forEach((g, k) => { const ids = g[1].filter(i => IND[i]); drawChart($('#lf' + k), { type: 'hbar', cats: ids.map(i => IND[i].easy.replace(/ 사람$| 아동$/, '')), series: [{ name: g[0], vals: ids.map(PV) }], unit: '%', showVal: true, title: g[0], w: 430, h: 60 + ids.length * 44 }); });
}
function vPubMap(side, main) {
  const id = IND[ST.pi] ? ST.pi : 'bp', d = IND[id], t = S.tabs[id].sido;
  side.innerHTML = `<h3>보고 싶은 항목</h3>${sel('pi', S.inds.map(x => [x.id, x.easy]), id)}<label class="f">색상</label>${sel('pal', Object.keys(PAL).map(p => [p, PAL_NAME[p]]), ST.pal)}
   <label class="f">강조할 지역</label>${sel('hl', [['', '없음']].concat(SIDO.map((n, i) => [i, n])), ST.hl)}

   <div class="grid2"><div class="panel"><div id="map"></div></div><div class="panel"><h4>시도별 순위</h4>${tableHTML(['순위', '시도', '100명 중(명)'], order.map((x, r) => [r + 1, { t: SIDO[x[1]], cls: 'l' }, fmtN(x[0], 1)]), { hl: ST.hl === '' ? -1 : order.findIndex(x => x[1] === +ST.hl) })}</div></div>

  $('#png').onclick = () => savePNG(svg, `지도_${d.easy}`);
}

  $('#png').onclick = () => savePNG(svg, `연령대별_${cats[a]}`);

    ['표시하지 않는 칸', '해당하는 사람 수가 적으면 누구의 정보인지 짐작할 수 있으므로 수치를 보여 주지 않음']];

   <div class="panel"><h4>자료 안내</h4>${tableHTML(['항목', '내용'], [['자료', { t: '코드북과 같은 변수 구조로 생성한 가상데이터의 집계값', cls: 'l', style: 'white-space:normal;text-align:left' }], ['제공 단위', '전국, 시도, 연령대'], ['표시 기준', { t: '사람 수 30명 이상인 칸만 표시, 비율만 제공', cls: 'l', style: 'white-space:normal;text-align:left' }], ['제공하지 않는 것', { t: '시군구 단위, 여러 조건을 겹친 교차표, 금액, 개인 단위 자료', cls: 'l', style: 'white-space:normal;text-align:left' }], ['공개 절차', { t: '공개 전에 심의를 거친 집계표만 수록하는 것을 전제로 함', cls: 'l', style: 'white-space:normal;text-align:left' }]])}
   <p class="note">행정 경계: ${esc(G.source || '')}</p></div></div>`;
}

/* ───────────── 틀 ───────────── */
const TABS = S.meta.public ? [['home', '한눈에 보기', vPubHome], ['map', '지역별 지도', vPubMap], ['age', '연령대별로 보기', vPubAge], ['terms', '용어 풀이', vPubTerms]] : [['home', '개요', vHome], ['map', '지표 지도', vMap], ['chart', '그래프', vChart], ['cross', '교차분석', vCross], ['group', '대상별 현황', vGroup], ['builder', '지표 만들기', vBuilder], ['vars', '변수 탐색', vVars], ['sim', '정책 모의실험', vSim], ['guide', '이용 안내', vGuide]];
function render() {
  const t = TABS.find(x => x[0] === ST.t) || TABS[0];
  $('#nav').innerHTML = TABS.map(x => `<button data-t="${x[0]}" class="${x[0] === t[0] ? 'on' : ''}">${x[1]}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => set({ t: b.dataset.t }));
  $('#page').classList.remove('wide'); hideTip();
  try { t[2]($('#side'), $('#main')); } catch (e) { $('#main').innerHTML = `<div class="warn">화면을 그리는 중 오류가 발생함: ${esc(e.message)}</div>`; console.error(e); }
}
$('#hsub').textContent = `집계 기준일 ${S.meta.built} · 개인 단위 자료 미포함`;

$('#foot').textContent = S.meta.public ? '자료: 가상데이터 집계값. 실제 통계가 아니며 인용할 수 없음. 사람 수 30명 이상인 칸만 표시함.' : `자료: 가상데이터(확대 생성본) 집계값. 실제 현황이 아니며 인용할 수 없음. 등급별 최소 관측 수 가 ${THR['가']} · 나 ${THR['나']} · 다 ${THR['다']}.`;

readHash(); render();
