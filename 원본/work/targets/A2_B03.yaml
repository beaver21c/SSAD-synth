  - name: "15세 미만 개인 일차소득 = 0 (위반 0건)"
    grade: S0
    kind: count
    expr: "(df.age<15) & ((df.p_labinc.fillna(0)+df.p_dainc.fillna(0)+df.p_binc.fillna(0)+df.p_fininc.fillna(0)+df.p_reinc.fillna(0)+df.p_pripeninc.fillna(0)+df.p_othinc.fillna(0))!=0)"
    target: 0
    tol: 0.0
    tol_kind: pp
    source: "코드북 '추출 정보 가공' — 15세 미만 소득 없음 (작업지시서 §6 B03)"

  - name: "p_* 결측 0건 (무정보 사례 0원 처리)"
    grade: S0
    kind: count
    expr: "df[['p_labinc','p_dainc','p_binc','p_fininc','p_reinc','p_pripeninc','p_othinc']].isna().any(axis=1)"
    target: 0
    tol: 0.0
    tol_kind: pp
    source: "코드북 추출대상: '2022.11.1. 기준 일반가구 및 일반가구원 (무정보 사례 0원 처리)'"
