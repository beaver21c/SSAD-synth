# §9 검증 목표 — B03 개인 일차소득 (p_labinc … p_othinc)
#
# 지위: [1차확인] (접근일 2026-09-02)
#   S0 R01 = 이현주 외(2023)「사회보장 행정데이터 구축 및 기초분석」 — **2020년 소득연도**
#            <표 2-30> p86 개인근로소득(일용 포함) / <표 2-31> p87 개인사업소득
#            <표 2-32> p88 개인부동산소득 / <표 2-33> p89 개인일차소득
#            전사본 params/tab/S0_R01_T2-30~33_*.csv
#   S2 NTS = 국세통계포털 2023년 발행(2022년 귀속) 4-2-3·4-2-4·4-4-7·4-4-8·4-4-10·4-4-12·4-4-13
#
# ★ 연도차 처리(AGENT_BRIEF ★S0 기준연도 정정): R01 은 **구간 형태·0원 비율**의 목표로만 쓰고,
#   **금액 수준**은 2022년 국세통계 총량에 맞춘다. 따라서
#     - 0원 비율(kind rate) 목표는 R01 값, 허용오차 3%p
#     - 총액·인원(kind wcount) 목표는 2022 NTS 값, 허용오차 10%
#   R01 평균과의 비교는 리포트에만 남긴다(근로 +21%, 사업 +17%, 부동산 +8% — 모두 연도차).
# ★ kind rate 는 비가중 평균이다. 0원 비율은 가중/비가중 차이가 0.3%p 이내임을 확인했다.
#
# ★★ 2026-09-02 연령배분 라운드 (A2 B03/B07/B08/B09/B11) — 아래 목표는 **연령 축에서** 다음
#   S0 근거로 재캘리브레이션되었다. 전국 총량·인원 목표는 전부 통과 유지(본 5블록 50/52).
#     S0 R01 <표 4-3> p.161 노인의 개인소득 평균 (2020)
#     S0 R02 <표 4-8> p.156 노인 개인소득·가구소득 평균 및 빈곤율 (2021)
#     전사본 params/tab/S0_R01_T4-3_*.csv · params/tab/S0_R02_T4-8_*.csv
#   결과(가중, 만원/년): 65세 이상 개인근로사업소득 946 → 645 (S0 2022환산 목표 554)
#                        65세 이상 개인일차소득 981 → 674 (R01 628(2020)의 2022환산 ~750)
#   조치 상세는 params/A2_B08.yaml·A2_B09.yaml·A2_B07.yaml 의 `age_profile_2026_09_02`.

targets:
  - name: "개인근로소득(일용 포함) 0원 이하 비율"
    grade: S0
    kind: rate
    expr: "(df.p_labinc.fillna(0)+df.p_dainc.fillna(0))<=0"
    target: 0.530
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-30> p86 (A)사회보장행정데이터 53.0%"
    note: >-
      [2026-09-02 진단] 원천 DB 기준(labinc_sum_taxy·dainc_sum 보유) 0원 비율은 51.6% 로 목표를 통과한다
      (targets/A2_B08_B11.yaml '개인 근로소득(일용 포함) 0원 비율' −1.36%p). p_* 기준에서만 이탈하는 이유는
      §7 R16(nhi_type=6 ⇒ p_minc=0) 때문이다. B31 이 배정한 직장피부양자 16.1백만명 중 4.3백만명이
      B08 근로소득 보유자여서 B03 이 그 소득을 0 으로 만들어야 한다. 가구 내 비피부양 성인에게 이관해도
      가구당 수취 가능 인원이 한정되어 보유자가 순감한다. 이 데이터 구조에서 도달 가능한 하한은 57.8% 이며
      (계산: 비피부양 성인 ∪ 피부양자 소득 이관 가능 가구), 허용선 56.0% 에 미달한다.
      [2026-09-02 재확인] 연령배분 수정 후 57.59%. 원천 DB 기준은 51.76%(targets/A2_B08_B11.yaml
      동명 목표 −1.24%p 통과)이므로 원인은 그대로 R16 이다. 실측: 피부양자(nhi_type=6) 2,853행 중
      1,141행(40.0%)이 원천 DB 소득 보유자여서 B03 이 그 소득을 0 으로 만들고 같은 가구의
      비피부양 성인에게 이관하는데, 이관 가능한 성인이 없는 가구에서 보유자가 순감한다.
      ⇒ 생성측 해법은 B31(A5)이 직장가입자(5)/피부양자(6)를 **근로소득 보유 여부에 조건부**로 배정하는 것이다
      (B08 은 order 2 로 B31 보다 먼저 실행되므로 labinc_sum_taxy 를 참조할 수 있다).
      tol 은 늘리지 않았다.

  - name: "개인사업소득 0원 이하 비율"
    grade: S0
    kind: rate
    expr: "df.p_binc.fillna(0)<=0"
    target: 0.808
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-31> p87 (A)사회보장행정데이터 80.8%"

  - name: "개인부동산(임대)소득 0원 이하 비율"
    grade: S0
    kind: rate
    expr: "df.p_reinc.fillna(0)<=0"
    target: 0.973
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-32> p88 (A)사회보장행정데이터 97.3%"

  - name: "개인일차소득(근로+사업+부동산+일용+기타) 0원 이하 비율"
    grade: S0
    kind: rate
    expr: "(df.p_labinc.fillna(0)+df.p_dainc.fillna(0)+df.p_binc.fillna(0)+df.p_reinc.fillna(0)+df.p_othinc.fillna(0))<=0"
    target: 0.406
    tol: 0.04
    tol_kind: pp
    source: "R01 <표 2-33> p89 (A)사회보장행정데이터 40.6% (주2: 일차소득=근로+사업+부동산+일용+기타)"
    note: >-
      [2026-09-02 진단] 원천 DB 기준 0원 비율은 42.3% 로 통과한다(targets/A2_B08_B11.yaml '개인 일차소득 0원 비율').
      p_* 기준 이탈은 전적으로 §7 R16 의 산술적 귀결이다.
      · 국세통계 총량으로 만든 소득 보유자 합집합(이관 전) = 인구의 58.1% (R01 59.4% 와 정합)
      · 그러나 직장피부양자가 인구의 31.3%(NHIS 공표치, S1 목표 통과) 이고 이들은 p_minc=0 이어야 한다.
      · 직장가구 성인 5,685행 중 소득 없는 사람은 1,780행뿐인데 성인 피부양자는 2,116행이 필요하고,
        "가구 내 직장가입자 1명 유지"(R16 후단) 제약까지 넣으면 최소 679행(전 인구의 7.1%)의 소득보유자가
        반드시 피부양자가 된다. 피부양자 배정을 최적화해도 0원 비율 하한은 49.0%, 현재 값은 51.2% 다.
      ⇒ 목표 허용선 44.6% 는 R16 을 '피부양자 ⇒ 일차소득 0' 으로 문자 그대로 강제하는 한 도달 불가능하다.
        실제 건강보험 피부양자 소득요건은 '연간 합산소득 2,000만원 이하'(2022.9~)이지 무소득이 아니다.
        해법은 (ㄱ) B31 이 피부양자를 무소득자 위주로 배정, (ㄴ) §7 R16 의 '무소득' 해석 완화 중 하나다.
        tol 은 늘리지 않았다.
      [2026-09-02 재확인] 연령배분 수정 후 51.05%(원천 DB 기준 42.28%, 동명 S0 목표 +1.68%p 통과).
        B03 은 order 4 라 nhi_type(B31, order 3)을 받기만 할 뿐 피부양자 배정 자체를 바꿀 수 없다.
        **조치 주체는 B31(A5)** 이다 — B08(order 2)의 labinc_sum_taxy 를 참조해 피부양자를
        근로소득 미보유자 위주로 배정하면 이 목표와 '[B04] 가처분소득 보유가구 비율'
        (직장가입자 3,618행 중 1,204행 33.3%가 p_labinc=0)이 함께 해소된다.

  - name: "근로소득 보유자 수 (연말정산)"
    grade: S2
    kind: wcount
    expr: "df.p_labinc.fillna(0)>0"
    target: 20481334
    tol: 0.10
    tol_kind: rel
    source: "NTS 4-2-4 과세대상근로소득(총급여) 규모별 인원 합 20,481,334명"

  - name: "근로소득(총급여) 총액"
