# §9 1차 합격 기준 — B04(공적이전소득 49개·소득 합계·세금·사회보험료) 검증 목표
#
# 지위: 아래 target 값은 모두 원문 표를 직접 열람·전사한 [1차확인] (접근일 2026-09-02).
#   R01 = 이현주 외(2023) 「사회보장 행정데이터 구축 및 기초분석」  ← 1기, 2020년(소득연도) 기준
#         params/raw/R01_사회보장행정데이터_기초분석_2023_최종보고서.pdf
#   R02 = 「2023년 사회보장 행정데이터 구축 및 기초분석」            ← 2기, 2021년(소득연도) 기준
#         params/raw/R02_2023년_사회보장행정데이터_기초분석_보고서.pdf
#   NTS = 국세청 국세통계 4-3-3 (2023 발행 = 2022 귀속)             ← S1
#         params/tab/NTS_4-3-3_공적연금_연말정산_총연금수령액규모별_2022.csv
#
# ★ 소득 정의 (R01 <표 2-38>·<표 2-39> 주2, p.94·p.95 [1차확인])
#     · 일차소득  : 근로소득+사업소득+부동산소득+일용소득+기타소득
#     · 가처분소득: 일차소득+공적이전소득-소득세·재산세·국민연금 보험료·건강보험료·고용보험료
#   3기(2022) 코드북은 여기에 금융소득·사적연금소득, 직역연금 보험료·장기요양보험료를 더한다.
#
# ★ 빈곤선 정의가 표마다 다르다 — 목표값 선택 시 반드시 확인할 것
#     · R01 <표 2-38>/<표 2-39> 주5: 빈곤선 = **개인단위 균등화 가구가처분소득 중윗값의 50%**
#       (일차소득 빈곤율도 같은 가처분소득 기준선을 쓴다)
#     · R01 <표 10-23> / R02 <표 11-13> 주2: 빈곤선 = **일차소득 기준**
#   tools/validate.py 의 `_pov(df, col)` 은 **해당 소득의 자체 중윗값 50%** 를 쓰므로
#     - __poverty_disp_*__  ↔ <표 2-39> 와 방법이 일치한다.
#     - __poverty_market_*__ ↔ <표 10-23>/<표 11-13> 와 방법이 일치하고, <표 2-38> 과는 불일치한다.
#   → targets/S0_core.yaml 의 "상대빈곤율 — 균등화 가구일차소득 기준(전체 인구) 0.326(<표 2-38>)" 은
#     방법 불일치 목표이므로 아래 39.93%(R02 <표 11-13>)/38.95%(R01 <표 10-23>) 로 교체 권고.
#
# ★ 가중: kind rate/mean 은 **비가중** 평균이다. 원문은 가중 추정치이므로 표본 가중치 분산만큼
#   차이가 남는다. 총량형(만원 단위) 목표에는 rel 15~25% 를 적용했다.
# ★ 연도차: R01=2020, R02=2021, 본 가상데이터=2022. 구조(상대크기) 재현 기준으로 사용한다.

targets:

  # ══════ 1. R01 <표 2-36> 개인공적이전소득 항목 분포 (개인단위·비균등화) ══════
  #  주1: 수급률 = 연간 소득이 0원 초과인 비율, 수급자 평균 = 수급자의 연간 소득 평균
  #  targets/S0_core.yaml 은 같은 표를 *_yn 변수로 검증한다. 여기서는 **B04 가 복사한
  #  p_*_amt** 로 재검증한다 (복사 누락·항목군 구성 오류를 잡는 목적).
  - name: "[B04] 공적연금 수급률 — p_*_amt 기준 (개인)"
    grade: S0
    kind: rate
    expr: "df._p_pubpension_amt > 0"
    target: 0.117
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-36> p.92 (A)열 11.7% · 공적연금=국민+공무원+사학+군인+별정우체국 정기연금 5종"

  - name: "[B04] 공적연금 수급자 평균 급여액(원/년)"
    grade: S0
    kind: mean
    filter: "_p_pubpension_amt > 0"
    expr: "df._p_pubpension_amt"
    target: 7670000
    tol: 0.20
    tol_kind: rel
    source: "R01 <표 2-36> p.92 (A)열 767만 원/년"

  - name: "[B04] 기초연금 수급률 — p_bp_amt 기준 (개인)"
    grade: S0
    kind: rate
    expr: "df.p_bp_amt > 0"
    target: 0.108
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-36> p.92 (A)열 10.8%"

  - name: "[B04] 기초연금 수급자 평균 급여액(원/년)"
    grade: S0
    kind: mean
    filter: "p_bp_amt > 0"
    expr: "df.p_bp_amt"
    target: 2850000
    tol: 0.15
    tol_kind: rel
    source: "R01 <표 2-36> p.92 (A)열 285만 원/년"

  - name: "[B04] 장애 관련 급여 수급률 (개인)"
    grade: S0
    kind: rate
    expr: "df._p_disbn_amt > 0"
    target: 0.014
    tol: 0.03
    tol_kind: pp
