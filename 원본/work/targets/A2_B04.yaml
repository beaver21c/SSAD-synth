    target: 1650000
    tol: 0.20
    tol_kind: rel
    source: "R01 <표 2-36> p.92 (A)열 165만 원/년"

  - name: "[B04] 근로·자녀장려금 수급률 (개인)"
    grade: S0
    kind: rate
    expr: "df._p_itcgrp_amt > 0"
    target: 0.088
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-36> p.92 (A)열 8.8%"

  - name: "[B04] 근로·자녀장려금 수급자 평균액(원/년)"
    grade: S0
    kind: mean
    filter: "_p_itcgrp_amt > 0"
    expr: "df._p_itcgrp_amt"
    target: 1150000
    tol: 0.20
    tol_kind: rel
    source: "R01 <표 2-36> p.92 (A)열 115만 원/년"

  - name: "[B04] 고용·산재보험 급여 수급률 (개인)"
    grade: S0
    kind: rate
