    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-36> p.92 (A)열 4.4% · 실업급여 5종+모성보호급여 6종+산재 정기연금"

  - name: "[B04] 고용·산재보험 급여 수급자 평균액(원/년)"
    grade: S0
    kind: mean
    filter: "_p_empocc_amt > 0"
    expr: "df._p_empocc_amt"
    target: 8390000
    tol: 0.25
    tol_kind: rel
