  # ══════ 2. R01 <표 2-37> 비균등화 가구공적이전소득 항목 분포 (가구단위) ══════
  - name: "[B04] 기초보장급여 수급률 (가구, 가구합 amt>0)"
    grade: S0
    kind: rate
    filter: "head == 1"
    expr: "df._h_nblsbn_amt > 0"
    target: 0.058
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-37> p.92 (A)열 5.8% · 주2 생계급여+주거급여(+자활장려금, 본 데이터 미포함)"

  - name: "[B04] 기초보장급여 수급가구 평균액(원/년)"
    grade: S0
    kind: mean
    filter: "(head == 1) & (_h_nblsbn_amt > 0)"
    expr: "df._h_nblsbn_amt"
    target: 4900000
    tol: 0.25
    tol_kind: rel
    source: "R01 <표 2-37> p.92 (A)열 490만 원/년 (자활장려금 제외분이라 과소 방향 편의)"

  - name: "[B04] 아동 관련 급여 수급률 (가구, 가구합 amt>0)"
    grade: S0
    kind: rate
    filter: "head == 1"
    expr: "df._h_childbn_amt > 0"
    target: 0.105
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-37> p.92 (A)열 10.5% · 주3 아동수당+양육수당+한부모가족지원(+영아수당 2022 신설)"

  - name: "[B04] 아동 관련 급여 수급가구 평균액(원/년)"
    grade: S0
    kind: mean
    filter: "(head == 1) & (_h_childbn_amt > 0)"
    expr: "df._h_childbn_amt"
    target: 2030000
    tol: 0.30
    tol_kind: rel
    source: "R01 <표 2-37> p.92 (A)열 203만 원/년 (2022 영아수당 신설분만큼 상향 방향 편의)"
    note: >-
      2026-09-02 A2/B04 진단 — 재현값 270.9만원(+33.5%)의 원인 분해. **tol 은 변경하지 않았다.**
      (1) 연도차 (c): 영아수당은 2022년 신설(월 30만원)이라 R01(2020년 기준)에 없다.
          영아수당을 제외하면 190.5만원(−6.2%)으로 목표와 정확히 맞는다 → 나머지 항목(아동수당·
          양육수당·한부모)의 재현은 정상이다.
      (2) 영아수당을 **전국 실제 규모**(R05 <표 4-3-12> 수급아동 219,524명)로 환산하면 218.1만원
          (+7.5%)이 되어 tol 0.30 안에 든다. 즉 연도차만으로는 +7.5% 만 설명된다.
      (3) 남은 +26%p 는 **상위 블록(B01) 결함**이다. 가중 age0 인구가 800,931명으로 주민등록
          2022.11 의 243,350명 대비 3.29배다(0~9세 밴드 합계는 3,550,007 vs 3,548,291 로 정확 —
          즉 가중치가 아니라 밴드 **내부** 단일연령 구성이 틀렸다. 1~4세는 0.39~0.68배로 과소이고
          0세 초과분 557,581명 = 1~4세 부족분 557,075명 과 정확히 일치한다).
          그 결과 영아수당 수급자가 가중 631,679명(실제 219,524명의 2.88배)으로 생성된다.
      → 조치는 B01(A1) 의 단일연령 배정 수정. B04·B28 단에서 tol 로 흡수하면 안 된다.

  # ══════ 3. R01 <표 2-38>·<표 2-39> 균등화 가구소득 분배지표 (개인단위) ══════
  #  S0_core.yaml 에 이미 있는 항목(gini_disp, gini_market, poverty_disp_all/65/017,
  #  median_eq_disp)은 중복 등록하지 않고 아래 보완분만 둔다.
  - name: "[B04] 균등화 가구일차소득 중윗값(원/년)"
    grade: S0
    kind: expr
    expr: "__median_eq_market__"
    target: 22690000
    tol: 0.15
    tol_kind: rel
    source: "R01 <표 2-38> p.94 (A)열 2,269만 원/년"

  - name: "[B04] 상대빈곤율 — 가처분소득 기준 (18~64세)"
    grade: S0
    kind: expr
    expr: "__poverty_disp_1864__"
    target: 0.234
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-39> p.95 (A)열 23.4%"

  - name: "[B04] 상대빈곤율 — 가처분소득 기준 (65세 이상) · R02 교차확인"
    grade: S0
    kind: expr
    expr: "__poverty_disp_65__"
    target: 0.483
    tol: 0.03
    tol_kind: pp
    source: "R02 <표 4-7> p.? 전체 노인 가처분소득 빈곤율 48.3% (R01 <표 2-39> 48.2% 와 일치)"

  # ══════ 4. R02 <표 11-13> / R01 <표 10-23> 소득보장제도의 소득재분배 효과 ══════
  #  빈곤선 = 일차소득 기준 → validate 의 __poverty_market_*__ 와 방법이 일치한다.
  - name: "[B04] 균등화 가구일차소득 지니계수 (전인구) · R02"
    grade: S0
    kind: expr
    expr: "__gini_market__"
    target: 0.5521
    tol: 0.035
    tol_kind: pp
    source: "R02 <표 11-13> p.414 전인구 일차소득 지니 0.55210 (R01 <표 10-23> 0.52634 / <표 2-38> 0.529)"

  - name: "[B04] 상대빈곤율 — 일차소득 기준·일차소득 빈곤선 (전인구) · R02"
    grade: S0
    kind: expr
    expr: "__poverty_market_all__"
    target: 0.3993
    tol: 0.035
    tol_kind: pp
    source: "R02 <표 11-13> p.414 전인구 중위50 일차소득 39.93% (R01 <표 10-23> 38.95%)"

  - name: "[B04] 상대빈곤율 — 일차소득 기준 (65세 이상)"
    grade: S0
    kind: expr
    expr: "__poverty_market_65__"
    target: 0.644
    tol: 0.06
    tol_kind: pp
    source: "R02 <표 4-7> 전체 노인 일차소득 빈곤율 64.4% (R01 <표 2-38> 65세+ 66.1%, 빈곤선 정의 상이 → tol 완화)"

  # ══════ 5. R02 <표 2-13> 소득원천별 가구소득 (가구단위, 비균등화) ══════
  - name: "[B04] 일차소득 보유가구 비율"
    grade: S0
    kind: rate
    filter: "head == 1"
    expr: "df.h_minc > 0"
    target: 0.974
    tol: 0.03
    tol_kind: pp
    source: "R02 <표 2-13> 일차소득 소득가구비율 97.4% (금융소득 포함 3기 정의)"

  - name: "[B04] 경상소득 보유가구 비율"
    grade: S0
    kind: rate
    filter: "head == 1"
    expr: "df.h_oinc > 0"
    target: 0.992
    tol: 0.03
    tol_kind: pp
    source: "R02 <표 2-13> 경상소득 소득가구비율 99.2%"

  - name: "[B04] 가처분소득 보유가구 비율"
    grade: S0
    kind: rate
    filter: "head == 1"
    expr: "df.h_dinc > 0"
    target: 0.968
    tol: 0.03
    tol_kind: pp
    source: "R02 <표 2-13> 가처분소득 소득가구비율 96.8%"
    note: >-
      2026-09-02 A2/B04 진단 — 재현값 91.3%(−5.49%p)의 원인. **tol 은 변경하지 않았다.**
      경상소득 보유가구 비율은 98.9%(R02 99.2%)로 정상이므로, 문제는 **세금·사회보험료가
      무소득 가구에 부과**된다는 점이다. 가처분≤0 인 365가구의 평균은 경상소득 139.9만원 대비
      소득세 183.2만 + 재산세 31.0만 + 사회보험료 245.6만원이다.
      성분별 제외 실험: 소득세 제외 91.45% / 재산세 제외 91.81% / **사회보험료 제외 95.88%**
      → 사회보험료가 지배적 원인이다.
      개인 단위 확인: 건강보험 직장가입자(nhi_type=5) 3,569명 중 **1,245명(34.9%)의 p_labinc 이 0**
      인데도 연 105만원의 건강보험료를 낸다. 고용보험료 납부자 4,331명 중 1,196명, 국민연금
      보험료 납부자 3,801명 중 671명이 p_minc≤0 이다.
      원인은 B31(order 3)·B13·B16 이 배정한 **가입자 자격**과 B03(order 4)이 생성한 **근로소득**이
      개인 단위로 연결돼 있지 않기 때문이다(column_contract 는 nhi_type=6 ⇒ p_minc=0 방향만
      규정하고, nhi_type=5 ⇒ 근로소득>0 방향은 규정하지 않는다).
      → 조치는 B03(A2) 이 `_occp_yn1_grp`·`nhi_type`·`empins_yn1` 보유자에게 근로소득을
      부여하는 것. B04 는 합산 블록이라 여기서 보정할 수 없다.

  - name: "[B04] 가구 일차소득 평균(원/년)"
    grade: S0
    kind: mean
    filter: "head == 1"
    expr: "df.h_minc"
    target: 48440000
    tol: 0.20
    tol_kind: rel
    source: "R02 <표 2-13> 일차소득 평균 4,844만 원/년 (2021년 기준)"

  - name: "[B04] 가구 경상소득 평균(원/년)"
