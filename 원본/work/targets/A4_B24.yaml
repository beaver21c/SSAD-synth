    tol_kind: rel
    source: "R05 <표5-4-6> 주거급여 집행 계 2,720,246백만원 − R07 임차급여 2,538,888백만원 [논리적추론]"

  # ── 급여 수준 ───────────────────────────────────────────────────────────
  - name: "[B24] 생계급여 수급자 1인당 연간 급여액(원)"
    grade: S1
    kind: mean
    filter: "nbls_live_yn1==1"
    expr: "df.nbls_live_amt"
    target: 4128000
    tol: 0.15
    tol_kind: rel
    source: "R07 생계급여(일반) 6,088,198백만원 ÷ 연간수급자 약 1,474,340명 [논리적추론]"

  # ── 의료급여 구성 (R05 표3-4-1) ─────────────────────────────────────────
  - name: "[B24] 의료급여 2종 수급권자 수 (가중)"
    grade: S1
    kind: wcount
    unit: person
    expr: "df.nbls_medi_type.fillna(0)==2"
    target: 357625
    tol: 0.20
    tol_kind: rel
    source: "R05 <표3-4-1> 2022 2종 357,625명"

  - name: "[B24] 의료급여 수급권자 중 65세 이상 (가중)"
    grade: S1
    kind: wcount
    unit: person
    filter: "age>=65"
    expr: "df.nbls_medi_yn1.fillna(0)==1"
    target: 625687
    tol: 0.12
    tol_kind: rel
    source: "R05 <표3-4-2> 의료급여 대상자 연령별 65-69 170,223 + 70-74 134,671 + 75-79 112,855 + 80-84 105,478 + 85+ 102,460 (= 625,687 / 1,522,292 = 41.1%). 교차확인: R10 Ⅰ-3-4 의료급여 적용인구 연령군별 동일 수치"
    note: "**B24 로는 고칠 수 없는 이탈.** §7 R08 이 nbls_medi_yn1 ⇔ nhi_type∈{7,8} 을 XOR 로 강제하고
      nhi_type 은 B31(A5, order 3)이 확정하므로, 의료급여 수급권자 집합·연령구조는 전적으로 B31 소관이다.
      현재 B31 산출 65세 이상 비중 63.2%(957,990/1,514,909) vs 원문 41.1%.
      원인: B31 의 의료급여 세대 선정 점수 base_sc 가 소득 잠재변수(hh_ui)와 가구주 65세 가점(-0.15)만
      쓰고, 같은 블록이 이미 읽어 둔 R10 Ⅰ-3-4 의 **연령군별 의료급여 적용률**(T['p_medi'])을 쓰지 않는다.
      조치 요청(A5/B31): 세대 선정 후 연령군별 적용인구를 R10 Ⅰ-3-4 에 맞추도록 재배정할 것.
      tol 은 근거 없이 늘리지 않는다."

  - name: "[B24] 의료급여 적용법 = 국민기초생활보장법 비율"
