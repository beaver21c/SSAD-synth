  # ── 수급기간 (R07·R08) ──────────────────────────────────────────────────
  - name: "[B24] 생계급여 평균 수급개월"
    grade: S1
    kind: mean
    filter: "nbls_live_yn1==1"
    expr: "df.nbls_live_dur"
    target: 11.64
    tol: 0.05
    tol_kind: rel
