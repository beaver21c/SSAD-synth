  # ── 급여 간 포함관계 (R03 <표5> 주석 "각 급여별 중복을 제외한 숫자임") ────────
  #   union 2,451,458 = 주거 2,260,783 + 190,675 이고 190,675 중 92,230 이 시설수급자이므로
  #   일반가구에서 주거급여 밖 수급자는 교육급여 단독 98,445명뿐이다.
  #   선정기준액 생계 30% < 의료 40% < 주거 46% < 교육 50% (R03 PDF p5) 와도 정합.
  - name: "[B24] 포함관계 위반 — 생계급여 ⊄ 주거급여 (표본 건수, 0이어야 함)"
    grade: S1
    kind: count
    expr: "(df.nbls_live_yn1.fillna(0)==1) & (df.nbls_house_yn1.fillna(0)!=1)"
    target: 0
    tol: 0
    tol_kind: pp
    source: "R03 <표5>·PDF p5 — 생계급여 선정기준(중위 30%) ⊂ 주거급여 선정기준(46%), 주거급여 부양의무자 기준은 '18.10 폐지"

  - name: "[B24] 포함관계 위반 — 기초의료급여 ⊄ 기초생활보장 수급자 (표본 건수, 0이어야 함)"
    grade: S1
    kind: count
    expr: "(df.nbls_medi_yn1.fillna(0)==1) & (df.nbls_medi_law.fillna(0)==1) & (df._is_nbls.fillna(0)!=1)"
    target: 0
    tol: 0
    tol_kind: pp
    source: "R05 <표3-4-1> 의료급여 적용법 1(국민기초생활보장법) 1,355,644명은 정의상 기초생활보장 수급자. 타법 85,370 + 의료급여법 686 은 제외"

  - name: "[B24] 포함관계 위반 — 교육급여 ⊄ 기초생활보장 수급자 (표본 건수, 0이어야 함)"
    grade: S1
    kind: count
    expr: "(df.nbls_edu_yn1.fillna(0)==1) & (df._is_nbls.fillna(0)!=1)"
    target: 0
    tol: 0
    tol_kind: pp
    source: "R03 <표5> 교육급여 303,383명은 계 2,451,458 의 부분집합"

  # ── (목표에서 제외) 교육급여 단독 수급자 수 = 98,445명 ────────────────────
  #   R03 <표5>에서 유도되는 구조값(계 2,451,458 − 주거 2,260,783 = 190,675, 그중 시설수급자
  #   92,230 제외 → 98,445명)이지만, **검증 목표로는 쓰지 않는다.**
  #   이유: nbls_house_yn1 은 임차급여 "보장가구원"(2,260,783명 / 1,628,643가구 = 1.388명)이고
  #   본 표본의 수급 가구는 등록센서스 가구(평균 1.45명)라, 수급가구 안에서 보장가구원으로
  #   선정되지 않는 가구원이 반드시 생긴다. 교육급여는 학생 개인에게 붙는 **수급권** 변수이므로
  #   그 학생들이 "주거급여 밖 교육급여 수급권자"로 잡혀(약 4만명) 98,445 와 비교할 수 없다.
  #   구조 자체는 아래 세 개의 포함관계 위반 목표(전부 0건)와 급여별 총량 목표로 검증된다.
  #   실측: 주거급여 밖 교육급여 수급권자 약 14만명 (그중 교육급여 단독가구 몫이 98,445명).
