# §9 검증 목표 — A2 국세청 원천 DB 블록 (B08 연말정산 근로소득 · B09 기타/원천징수사업/연말정산사업/일용 ·
#                                      B10 금융소득 · B11 사적연금)
#
# 출처: 국세청 국세통계 2023년 발행(= 2022년 귀속). TASIS 내부 API 직접 조회·전사 [1차확인 2026-09-02]
#       params/raw/NTS_*.csv  (표번호·STTS_MTA_INFR_ID 는 registry/acq_tax.md · registry/acq_a2_income.md)
#       S0 = R01 <표 2-30>·<표 2-31>·<표 2-33> (2020년 기준) params/tab/S0_R01_T2-3*.csv
#
# ⚠ S0 항목의 기준연도는 2020년, 본 데이터는 2022년이다. 2020→2022 사이 취업자·명목임금이 증가해
#   0원 비율은 S0 보다 낮게 나오는 것이 정상이다(§9 ±3%p 이내면 합격).

# ★ 2026-09-02 연령배분 라운드 — B08·B09 의 구간 내부 연령 프로파일이
#   φ(a)=1(a<60) · exp(-(a-60)/5.5)(60≤a<70) · exp(-(a-70)/9.3)(a≥70) 로 바뀌고,
#   65세 이상에는 가구유형별 상대위험(노인1인 0.71 / 노인만 2인이상 0.99 / 비노인동거 1.16)이
#   적용된다. 근거: S0 R01 <표 4-3> p.161 · R02 <표 4-8> p.156 [1차확인 2026-09-02]
#         전사본 params/tab/S0_R01_T4-3_*.csv · params/tab/S0_R02_T4-8_*.csv
#   구간 보유율은 모집단(주민등록 1세) 가중 평균으로 정규화하므로 아래 S1 총량 목표는
#   영향받지 않는다 (재확인 2026-09-02: 14개 총량 목표 전부 통과, 최대 편차 +6.8%).

targets:
  # ── S1 총량: 인원 (가중 추정 모집단) ──────────────────────────────────────
  - name: "근로소득 연말정산 신고 인원"
    grade: S1
    kind: wcount
    expr: "df.labinc_sum_taxy.notna()"
    target: 20534714
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-2-1 근로소득 연말정산Ⅰ(총괄) 급여총계 인원 (2022 귀속)"

  - name: "일용근로소득 지급명세서 순인원"
    grade: S1
    kind: wcount
    expr: "df.dainc_sum.notna()"
    target: 7087845
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-4-10 일용근로소득자별 지급명세서 제출 현황"

  - name: "원천징수 사업소득 인원"
    grade: S1
    kind: wcount
    expr: "df.binc_sum.notna()"
    target: 8473541
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-4-6 거주자의 사업소득 원천징수 신고 현황"

  - name: "기타소득 원천징수 인원"
    grade: S1
    kind: wcount
    expr: "df.othinc_sum.notna()"
    target: 5035437
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-4-8 거주자의 기타소득 원천징수 신고 현황"

  - name: "사업소득 연말정산 인원"
    grade: S1
    kind: wcount
    expr: "df.ybinc_sum.notna()"
    target: 529705
    tol: 0.15
    tol_kind: rel
    source: "국세통계 4-3-1 사업소득 연말정산Ⅰ(총괄) 수입금액 인원"

  - name: "사적연금(연금계좌) 연금소득 인원"
    grade: S1
    kind: wcount
    expr: "df.pripen_inc.notna()"
    target: 817500
    tol: 0.20
    tol_kind: rel
    source: "국세통계 4-4-7 거주자의 연금계좌 원천징수 신고 현황 — 연금소득 인원 (표본 122명, 55세 미만 수급자 0.2% 제외)"

  # ── S1 총량: 금액 (원) ────────────────────────────────────────────────────
  - name: "근로소득 급여총계 총액(원)"
    grade: S1
    kind: wcount
    expr: "df.labinc_sum_taxy.fillna(0)"
    target: 869287953000000
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-2-1 급여총계 869,287,953백만원"

  - name: "근로소득 결정세액 총액(원)"
    grade: S1
    kind: wcount
    expr: "df.labinc_inc_taxamt.fillna(0)"
    target: 59145880000000
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-2-1·4-2-4 결정세액 59,145,880백만원"

  - name: "일용근로소득 총소득금액(원)"
    grade: S1
    kind: wcount
    expr: "df.dainc_sum.fillna(0)"
    target: 66471851000000
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-4-10 총소득금액(과세소득) 66,471,851백만원"

  - name: "원천징수 사업소득 연간지급금액(원)"
    grade: S1
    kind: wcount
    expr: "df.binc_sum.fillna(0)"
    target: 136778483000000
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-4-6 연간지급금액 136,778,483백만원"

  - name: "기타소득 연간지급총액(원)"
    grade: S1
    kind: wcount
    expr: "df.othinc_sum.fillna(0)"
    target: 17529946000000
    tol: 0.15
    tol_kind: rel
    source: "국세통계 4-4-8 연간지급총액 17,529,946백만원 (상위 0.03% 구간이 표본에서 비어 하향 편의)"

  - name: "사업소득 연말정산 수입금액(원)"
    grade: S1
    kind: wcount
    expr: "df.ybinc_sum.fillna(0)"
    target: 8960951000000
    tol: 0.15
    tol_kind: rel
    source: "국세통계 4-3-1 수입금액 8,960,951백만원"

  - name: "금융소득(이자+배당) 소득금액 총액(원)"
    grade: S1
    kind: wcount
    expr: "df.fainc_sum.fillna(0)"
    target: 49057689000000
    tol: 0.10
    tol_kind: rel
    source: "국세통계 4-4-12 이자 19,873,890 + 4-4-13 배당 29,183,799 백만원"

  - name: "사적연금 연금소득 지급액 총액(원)"
    grade: S1
    kind: wcount
    expr: "df.pripen_inc.fillna(0)"
    target: 4381038000000
    tol: 0.20
    tol_kind: rel
    source: "국세통계 4-4-7 연금소득 지급액 4,381,038백만원"

  # ── S0 구조: 개인소득 0원 비율 (R01, 2020년 기준) ─────────────────────────
  - name: "개인 근로소득(일용 포함) 0원 비율"
    grade: S0
    kind: rate
    expr: "df.labinc_sum_taxy.isna() & df.dainc_sum.isna()"
    target: 0.530
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-30> 개인근로소득 분포 (A)열 0원 이하 53.0% · p.86 · 주2 '근로소득은 일용소득 포함'"

  - name: "개인 사업소득 0원 비율"
    grade: S0
    kind: rate
    expr: "df.binc_sum.isna() & df.ybinc_sum.isna()"
    target: 0.808
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-31> 개인사업소득 분포 (A)열 0원 이하 80.8% · p.87 (종합소득 신고 사업소득 B07 제외분)"

  - name: "개인 일차소득 0원 비율"
    grade: S0
    kind: rate
    expr: "df.labinc_sum_taxy.isna() & df.dainc_sum.isna() & df.binc_sum.isna() & df.ybinc_sum.isna() & df.othinc_sum.isna()"
    target: 0.406
    tol: 0.03
    tol_kind: pp
    source: "R01 <표 2-33> 개인일차소득 분포 (A)열 0원 이하 40.6% · p.89 (부동산소득 B05·B07 제외분)"
